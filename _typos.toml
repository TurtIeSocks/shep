# Exceptions for `crate-ci/typos` (CI job `typos`, `.github/workflows/test.yml`).
# Every entry here was read in context, not defaulted.

[default.extend-words]
# The TUI crate this project depends on, throughout `shep lookout`
# (crates/shep-cli/src/lookout, docs/lookout). Not "ratatouille".
ratatui = "ratatui"

# `toml::ser`, serde's real serialize-module path. Not a typo of "set".
ser = "ser"

# `flate2`, the real compression crate named in the trace docs
# (docs/systematic-refactor/refactor-workspace/trace/_all-rust_map.md).
flate = "flate"

# Verb-ified seek(2), matching `kill.rs`/`bleats.rs`'s `` `stat`ed `` for
# stat(2). Not the English verb "sought".
seeked = "seeked"

# Consistent spelling across 25 sites for "cannot be parsed"; an accepted
# alternative to "unparsable", not a slip.
unparseable = "unparseable"

# Hyphenated prefix, as in "a mis-read pid" / "dangerous mis-wiring": typos
# tokenizes across the hyphen, so "mis" alone looks like a word rather than
# the prefix it is.
mis = "mis"

# `allow_contro`: a truncated test fixture in config/daemon.rs, proving the
# error message for a truncated TOML key.
contro = "contro"

# `instnace`: deliberate misspelling. `{{instnace}}` proves an unknown
# template token is refused by name; tests in config/normalize.rs and
# config/template.rs assert the error names it.
instnace = "instnace"

# `retsarts`: deliberate misspelling of `restarts`, asserted by name in
# dog/bark/rules.rs's `a_misspelled_trigger_field_is_refused_with_the_bad_key_named`.
retsarts = "retsarts"

# Triggered by "marketing PNGs": typos splits the plural acronym into "PN" +
# "Gs" and flags "PN" as a typo of "ON".
pn = "pn"

# The next five are pm2's own spellings, quoted verbatim in the read-only
# trace docs this port's specs are built from; correcting them would misquote
# the source.
gracefull = "gracefull" # trace/rpc.md:14, pm2's own `gracefullExit`
instanciate = "instanciate" # trace/cli.md:95, pm2's own `Runtime.instanciate`
knonw = "knonw" # trace/aux-plumbing.md:9, pm2's own `knonwConfigFileExtensions`
formated = "formated" # trace/core.md:23, pm2's own `getFormatedProcesses`
shouldnot = "shouldnot" # trace/tests.md:13, pm2's own test helper name
resurect = "resurect" # trace/tests.md:48, pm2's own `resurect_state.mocha.js`

# `sheeps`/`childs`: singular possessives with the apostrophe dropped, since
# Rust identifiers cannot carry one (`a_running_sheeps_uptime_...` reads "a
# running sheep's uptime..."). Not the plural CLAUDE.md bans.
sheeps = "sheeps"
childs = "childs"
