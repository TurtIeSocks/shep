[package]
name = "shep-examples"
description = "Small runnable programs that demonstrate shep's supervision behaviours: probes, restarts, memory limits, graceful stop and the log plane. Not published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# `cargo build --release` at the workspace root builds this crate too, but
# it is never on the dependency path of the shipped binaries: `cargo install
# shep` resolves only shep-cli's own graph. A standalone member, not test
# scaffolding, because these programs are documentation and need a stable
# path a Flockfile can name.
#
# `publish = false` keeps `cargo publish --workspace` (and release-plz) from
# ever trying to ship it; release-plz.toml does not list it either.

# Every binary here is a plain executable, no shared library or crate-level
# public API, so `src/bin/*.rs` is autodiscovered with no `[[bin]]` table
# needed per binary.

# `stubborn.rs` blocks SIGTERM with `nix::sys::signal::SigSet::thread_block`
# and waits on it with `sigwait`, both safe, so this crate stays
# `#![forbid(unsafe_code)]`. Adds no new crate: only `signal`, already in
# nix's workspace default features, is used.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[lints]
workspace = true
