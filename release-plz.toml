# release-plz owns the version bump, the tag, the GitHub release and the
# upload. It does NOT write the changelogs; see changelog_update below.
#
# ## This used to be split, and the split was wrong
#
# Until 2026-08-26 this file ran `release-pr` only, and a hand-written
# .github/workflows/release.yml published behind a `v*` tag. The stated reason
# was that "publishing cannot be undone, and a push to main is a lower bar to
# clear by accident than pushing a tag."
#
# That has the risk backwards. Publishing under the standard setup requires
# merging a pull request TITLED "chore: release vX.Y.Z". That is a reviewed,
# named, visible artifact. Pushing a tag is a command someone types. The merge
# is the more deliberate act, not the less.
#
# The cost showed up the same day. Rin merged the release PR for 0.1.1
# reasonably expecting a release, and got silence, because the repository did
# something non-standard and the non-standardness was invisible from outside.
# A release process that surprises the person releasing has failed at the only
# job it has.
#
# What the split was protecting turned out to be mostly covered, but not for
# free. The tag-versus-manifest check is unnecessary once release-plz derives
# the tag from the manifest, since they cannot then disagree. The test
# re-run on the tag is NOT simply redundant with test.yml: the first version
# of this move had `release` and test.yml both triggering on push to main
# with no ordering between them, which is a race, not a proof -- `release`
# could have published before the matrix finished, or after it failed.
# `.github/workflows/release-plz.yml`'s `release` job is gated on a
# `workflow_run` for test.yml's run on that same commit actually succeeding,
# which is what closes the race; nothing publishes without a green run
# against the commit it is about to publish.
#
# The `crates-io` environment survives the move, so a required reviewer can
# still be added there if this ever wants a human gate.

# ## On pre-releases, which is what this workspace is on right now
#
# release-plz publishes a pre-release fine and marks it as one on GitHub, via
# `git_release_type = "auto"` below. What it does not do is manage the
# progression: there is no automated path from `-alpha.1` to `-alpha.2` to
# `-beta.0` to a stable version. The maintainer said so directly in
# discussion #2443, where somebody asked this exact question, and
# `release-plz set-version` has open issues besides. So while this workspace
# is on an alpha, the version in `[workspace.package]` is set by hand and the
# release PR is a changelog PR.

[workspace]
# Marks a GitHub release as a pre-release when the version carries a SemVer
# pre-release tag, which `0.1.0-alpha.1` does. Without this an alpha appears
# on the releases page looking like any other version.
git_release_type = "auto"

# release-plz's own default is true, which would have `release` try to
# publish on every push to main whenever the manifest names an unpublished
# version -- not only after a release PR merges. That is wider than "merging
# the release PR is the publish" (docs/releasing.md, this file's own header
# comment), so it is turned off explicitly instead of left at the default.
release_always = false
# On its own, this does not close the push-vs-test.yml race described
# below in "This used to be split" -- it narrows *which* commits release
# can act on, not *when* it acts relative to the test matrix.

# The four real crates keep hand-written changelogs in Keep a Changelog form,
# and those are better than anything generated from commit subjects. Left on,
# release-plz inserts a generated section into each existing file: the first
# release PR added 576 lines across shep and shep-daemon, in a second style,
# next to entries that already covered the same work.
#
# It also copies commit subjects verbatim, so a typo in a commit message
# becomes a typo in a tracked file. That is what happened on PR #1: 551f3ce's
# subject misspells "organization", the generated changelog inherited the
# misspelling, and the `typos` job failed on a file nobody had written by
# hand. A commit message cannot be corrected after it is pushed, so with
# generation left on, that spelling would have had to be either committed or
# allowlisted forever.
#
# So the changelogs stay hand-written, per docs/releasing.md step 2, and
# release-plz is left with the version bump.
changelog_update = false

# Every crate here shares one version through `[workspace.package]`, and this
# says so to release-plz rather than leaving it to infer it. Without it, two
# crates whose commits imply different bumps would be assigned different
# versions, and the inheritance would then fight it.
[[package]]
name = "shep-core"
version_group = "shep"

[[package]]
name = "shep-client"
version_group = "shep"

[[package]]
name = "shep-daemon"
version_group = "shep"

[[package]]
name = "shep"
version_group = "shep"

# The placeholder holding the `shep-cli` name on crates.io. It has no code, so
# no commit will ever imply a version bump for it, and a changelog entry for
# an empty crate is noise. Left out of release-plz entirely; if it ever needs
# republishing, that is a deliberate act rather than a consequence of merging
# a release PR.
[[package]]
name = "shep-cli"
release = false
