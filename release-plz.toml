# release-plz owns the changelog, the version bump, the tag, the GitHub
# release and the upload. Merging the release pull request is the whole
# release, and that merge is automatic.
#
# `release_always` is left unset (the default, true) rather than false: false
# refuses to publish once a manifest names a version bumped outside a release
# PR, which can strand it with no path forward. What stops an untested commit
# from publishing instead is the `main` branch ruleset, which requires lint,
# docs, typos, the test matrix, features, musl and minimal-versions before
# anything can reach main at all.
#
# Changelogs are generated from conventional commits (release-plz-changelog.toml):
# it skips docs, test, ci, chore and style commits and emits Keep a Changelog
# form, so a generated section stays short and matches its hand-written
# neighbours. Two commits survive those skips: release-plz's own
# `chore: update Cargo.toml dependencies`, grouped under Internal so a
# lockstep bump is not a silent empty section, and anything marked breaking,
# which `protect_breaking_commits` keeps regardless of which parser matched
# it. `typos` is a required check on main, so a commit subject that would
# poison a changelog blocks its own release PR instead of landing.
#
# Not handled automatically: each crate's `## [Unreleased]` section.
# release-plz inserts its generated section near the top, which leaves that
# hand-written block sitting below a released version while still claiming
# to be unreleased. Roll it into the new version's section by hand.
#
# release-plz publishes a pre-release and marks it via `git_release_type`
# below, but does not manage the progression between pre-release stages
# (`-alpha.1` to `-alpha.2` to `-beta.0` to stable): the version in
# `[workspace.package]` is set by hand while on one.

[workspace]
# Marks a GitHub release as a pre-release when the version carries a SemVer
# pre-release tag. Inert for an ordinary version, kept for the next one that
# is not.
git_release_type = "auto"
git_release_enable = true

# Read by .coderabbit.yaml, whose `auto_review.labels: ["!release"]` skips a
# pull request carrying this label, since every commit in it was already
# reviewed on its own pull request. A label rather than the title, since
# release-plz force-pushes this branch on every push to main and the label is
# re-checked on each force-push. The label must already exist in the
# repository: release-plz opens the pull request, then calls GitHub's label
# endpoint separately, so an undefined name leaves the pull request opened
# and unlabelled with the job failing around it. Renaming or deleting the
# label silently un-skips every release pull request, since .coderabbit.yaml
# matches it by name.
pr_labels = ["release"]

# Generated from conventional commits through release-plz-changelog.toml.
changelog_update = true
changelog_config = "release-plz-changelog.toml"

# cargo-semver-checks runs against the published version. A breaking change in
# a patch bump fails the release PR rather than reaching crates.io.
semver_check = true

# Also the default, stated because the opposite skips the pre-upload build and
# an upload cannot be undone.
publish_no_verify = false

# Every crate here shares one version through `[workspace.package]`, and this
# says so to release-plz rather than leaving it to infer it. Without it, two
# crates whose commits imply different bumps would be assigned different
# versions, and the inheritance would then fight it.
[[package]]
name = "shep-core"
version_group = "shep"

[[package]]
name = "shep-client"
version_group = "shep"

[[package]]
name = "shep-macros"
version_group = "shep"

[[package]]
name = "shep-daemon"
version_group = "shep"

[[package]]
name = "shep"
version_group = "shep"

# The placeholder holding the `shep-cli` name on crates.io. Has no code, so
# no commit will ever imply a version bump; excluded from the release flow.
[[package]]
name = "shep-cli"
release = false

[[package]]
name = "shep-examples"
release = false
publish = false
