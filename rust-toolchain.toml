# Pins the toolchain so a local run and CI are the same thing.
#
# `stable` rather than a fixed version: CI's matrix is 1.88 (the MSRV) plus
# stable, so this matches the leg that moves. MSRV breakage is CI's job to
# catch, not this file's.
#
# x86_64-pc-windows-gnu needs a host C toolchain rustup cannot supply
# (`brew install mingw-w64`), since `ring`'s build script runs `cc`.
[toolchain]
channel = "stable"
components = ["clippy", "rustfmt"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu"]
