# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# CodeRabbit review settings. Everything here is a deviation from a default,
# so a key that is absent is deliberate: it means the default is right.
#
# The two things this file is trying to buy:
#
#   1. Stop spending a review on work no human is going to act on. Release
#      pull requests and generated artifacts are both in that class, and
#      between them they were most of what CodeRabbit read.
#   2. Give it the repository's own rules, so its comments land where the
#      project already has an opinion instead of restating generic Rust
#      advice the local gate already enforces.

language: en-US

# 250 characters, which is the cap. Spent on the two habits that produce
# comments nobody here will take: rewriting prose that is deliberate, and
# repeating a lint that CI already fails on.
tone_instructions: >-
  Be direct and specific. Prose in this repo is hand-written in a deliberate
  voice: flag factual drift, never style or wording. Do not repeat lints that
  CI already enforces as a required check.

reviews:
  # Assertive, not the `chill` default, and deliberately so. The label on this
  # setting is "may feel nitpicky", which is the trade being made: shep is a
  # process supervisor, so its failure modes are other people's processes not
  # coming back. A false positive costs a dismissed comment. A missed one
  # costs an operator their flock.
  #
  # The local gate is wide but it only ever answers "does this compile, lint
  # and pass". The path_instructions below are what turn the extra volume
  # into findings about THIS repository's rules rather than generic Rust
  # advice, so the two settings go together and neither is much use alone.
  profile: assertive

  auto_review:
    # release-plz opens these, and merging one IS the release. There is
    # nothing to review: the diff is a version bump plus a changelog section
    # that release-plz generated from commits already reviewed on their own
    # pull requests, and .github/workflows/release-plz-pr.yml auto-merges it
    # behind the `main` ruleset without a human in front of it. Eight of the
    # twenty pull requests before this rule went in were releases, and
    # CodeRabbit read every one; #38 got a 5.4 KB walkthrough and an approval
    # nobody read.
    #
    # Matched on a LABEL, which release-plz attaches itself through
    # `pr_labels` in release-plz.toml. `!release` means "review everything
    # except a pull request carrying this label".
    #
    # ## Two mechanisms that look right and are not
    #
    # `ignore_usernames` is the tidier-looking answer and is wrong here:
    # release-plz posts under RELEASE_PLZ_TOKEN, which is the maintainer's
    # PAT, so its pull requests are authored by the same account as every
    # other pull request in this repository. Ignoring that username would
    # ignore all of them.
    #
    # `ignore_title_keywords: ["chore: release v"]` was tried first and did
    # NOT hold, which is worth recording so nobody re-derives it. On #40 the
    # configuration was present on the head commit, carried that exact
    # keyword, and the title was "chore: release v0.1.10" -- and CodeRabbit
    # reviewed it anyway, reporting a commit RANGE rather than a whole pull
    # request. That is the tell: release-plz force-pushes its branch on every
    # push to main, each force-push starts an incremental review, and the
    # title gate does not appear to be re-evaluated on those. A label is
    # checked per review instead of parsed once, so it survives the
    # force-push that defeated the keyword.
    labels:
      - "!release"

  # Excluded because a comment on any of these cannot be acted on without
  # regenerating the file, which means the comment belongs on the generator
  # or on the source instead. Each one is written by a tool and pinned by a
  # test or a script; see .gitattributes, which lists most of them for the
  # same reason from the other direction.
  #
  # These also drive CodeRabbit's sparse-checkout, so an excluded path is not
  # cloned and is not available as context. That is why the two documentation
  # trees that a reviewer might genuinely want (`docs/specs`, `docs/shep-design`)
  # are not here despite being large.
  path_filters:
    - "!Cargo.lock"
    - "!web/package-lock.json"
    # Generated from the parser's own document type, printed by `shep schema`.
    - "!crates/shep-core/assets/flockfile.schema.json"
    # Generated from the real binary's `--help` by
    # web/scripts/generate-cli-reference.sh.
    - "!web/src/data/cli-reference.generated.txt"
    # Generated by whistle::catalogue and compared byte-for-byte by
    # `the_checked_in_catalogue_is_current`.
    - "!docs/whistle/tools.md"
    # Written by lookout's own `--ignored` frame writer.
    - "!docs/lookout/frames.txt"
    - "!docs/lookout/frames.ansi"
    # insta snapshots. A wire or layout change shows up in the source diff,
    # which is reviewed; the snapshot is only its receipt.
    - "!**/snapshots/*.snap"
    # Half generated by release-plz, half hand-written entries in Keep a
    # Changelog form. Neither half wants a review comment.
    - "!**/CHANGELOG.md"

  path_instructions:
    - path: "crates/**/*.rs"
      instructions: >-
        This workspace has a written Rust style, docs/idiomatic-rust.md, with
        46 numbered rules IR-1 through IR-46. Cite the rule number when a
        finding matches one.

        Load-bearing rules, in rough order of how often they drift: no
        panicking constructor outside the `shep` CLI crate; `core::error::Error`,
        never `std::error::Error`; every fallible public function carries a
        `# Errors` section; a `# Panics` section requires `#[track_caller]`;
        every new public item needs documentation and a deliberate `Debug`
        decision, redacted for anything carrying environment or secrets and
        proven by an exact-string test (IR-41).

        `#![forbid(unsafe_code)]` holds in shep-core, shep-client and shep.
        The only unsafe in the workspace is shep-daemon's `sys.rs` and
        `sys_windows.rs`, and every block there needs its own `// SAFETY:`
        comment (IR-22, IR-23).

        Weight a finding in test-only code lower than the same finding in
        code an operator runs. The assertive profile is set because a missed
        defect costs an operator their flock; a leaked descriptor in a test
        binary that is about to exit costs nothing, so the trade that
        justifies the volume does not apply there. Report it once, briefly,
        and do not re-raise it on a later push.

        Do not suggest widening an input grammar past what the specification
        says. A parser here refusing something is usually the specified
        behaviour rather than a gap. `reuse_port` is the exception, not an
        instance of it: the key is accepted, not refused, and its value picks
        reload's ordering — set, the reload overlaps the two instances;
        unset with a `readiness_probe`, the reload runs serial instead. Do
        not flag its acceptance as a parser gap.

    - path: "crates/shep-daemon/src/**"
      instructions: >-
        Platform gates matter here. macOS is the development host, so a
        `#[cfg(target_os = "linux")]` or `#[cfg(windows)]` arm is compiled by
        CI and by nothing else. Read those arms as carefully as the unix ones,
        because a local green says nothing about them.

        The OS transport lives in `shep_core::transport` and nowhere else.
        Adding a `cfg(unix)` above that layer is a design decision, not a
        shrug: say so if you see one appear.

    - path: "crates/shep-cli/src/**"
      instructions: >-
        This crate is the operator's whole surface. If a change adds, removes
        or renames a verb, flag, alias, exit code or JSON field, the
        documentation site under web/ has to change with it, and
        web/src/data/cli-reference.generated.txt has to be regenerated by
        web/scripts/generate-cli-reference.sh against a release build. Say so
        when a diff touches the surface and leaves web/ alone.

    - path: "crates/shep-core/src/config/**"
      instructions: >-
        A Flockfile or shep.toml key added or changed here also has to reach
        crates/shep-core/assets/flockfile.schema.json, which is generated and
        pinned by `the_committed_schema_is_current`, and the documentation
        pages under web/src/pages/docs/ that show sample configuration. Those
        samples are copy-pasteable, so a stale one is a broken one.

    - path: "web/src/pages/docs/*.astro"
      instructions: >-
        Hand-written pages; no generator touches them. `astro build` does not
        typecheck, so a wrong prop builds clean and renders wrong. Check
        component props against the component's own `interface Props`. The
        one that has already shipped broken is Callout, whose prop is
        `variant` with values "careful" or "note".

    - path: "**/*.md"
      instructions: >-
        Except where a more-specific Markdown rule sets terminology, prose
        here is hand-written and hand-wrapped in a deliberate voice. Do not
        suggest rewording, tightening, or rewrapping. Flag only factual
        drift: a claim about behaviour that the diff makes false, a command
        that no longer exists, a sample that will not parse.

        A residual the same diff already documents as a known limitation has
        been considered. Raise it once if the reasoning looks wrong, and not
        again on a later push.

    - path: "docs/writing-plans/**/*.md"
      instructions: >-
        Working documents, not published prose. The terminology rule below
        does not apply here: these name a feature after the verb an operator
        types, so "daemon handover" tracks `shep daemon reload` and matches
        the sibling plans deliberately. Flag factual drift only.

    - path: "docs/brainstorming/**/*.md"
      instructions: >-
        Design documents under revision, held to the same standard as the
        plans above: factual drift only, and the terminology rule does not
        reach them.

    - path: "web/**/*.md"
      instructions: >-
        Terminology is fixed by docs/terminology.md and this is published
        prose, so it applies in full. A `sheep` is one managed process and
        the word is singular only; the plural is `flock`, never "sheeps" and
        never bare "sheep". `dogs` are plugin processes, `lambs` are a
        sheep's children, and the daemon is only ever "the shepherd".

    - path: "README.md"
      instructions: >-
        Published prose. Terminology is fixed by docs/terminology.md: the
        plural of `sheep` is `flock`, and the daemon is only ever "the
        shepherd".

    - path: ".github/workflows/**"
      instructions: >-
        Every job needs `timeout-minutes`. GitHub's default is 360, and three
        runs had to be cancelled by hand before these were added.

        The two release-plz workflows hold RELEASE_PLZ_TOKEN and
        CARGO_REGISTRY_TOKEN, and every action in them is pinned by commit
        SHA on purpose. test.yml holds no secrets and uses moving tags. Flag
        a moving tag introduced into either release workflow; do not flag the
        tags in test.yml.

  tools:
    # CI runs `cargo clippy --workspace --all-targets --all-features
    # -- -D warnings` as a required check on main, on every push and pull
    # request. A second clippy here reports the same findings later.
    clippy:
      enabled: false
    # No ESLint, Biome or Stylelint configuration exists under web/, so these
    # would review Astro and TypeScript against defaults nobody chose.
    eslint:
      enabled: false
    biome:
      enabled: false
    oxc:
      enabled: false
    stylelint:
      enabled: false
    # `typos` is a required check with its own configuration in _typos.toml.
    # LanguageTool on top of it produces style opinions about deliberate
    # prose, which is the one thing tone_instructions above asks it not to do.
    languagetool:
      enabled: false
    markdownlint:
      enabled: false

  # No issue has ever been opened on this repository, and the label set is
  # GitHub's untouched default. Every one of these spends a section of the
  # walkthrough on a question with no answer.
  assess_linked_issues: false
  related_issues: false
  suggested_labels: false
  # One maintainer.
  suggested_reviewers: false

knowledge_base:
  code_guidelines:
    # An explicit list replaces the defaults rather than adding to them, so
    # the two default patterns this repository actually uses are restated.
    filePatterns:
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
      - "docs/idiomatic-rust.md"
      - "docs/terminology.md"
