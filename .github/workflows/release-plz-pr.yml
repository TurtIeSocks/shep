name: Release PR
# Maintains the pull request that bumps the version and writes the changelog,
# then queues it to merge itself.
#
# Split from the publish half on 2026-08-27, matching zendriver-rs. One file
# with two jobs meant one `on:` block serving two triggers that want different
# things, and the `if:` gymnastics needed to keep them apart were most of what
# the old file was. Two files, two concurrency groups, one trigger each.

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-plz-pr
  cancel-in-progress: false

jobs:
  release-plz-pr:
    name: Update release PR
    runs-on: ubuntu-latest
    # Never react to release-plz's own merge landing on main. The auto-merge
    # step below uses the PAT, and unlike a GITHUB_TOKEN push that DOES
    # retrigger this workflow, which closes a cycle: open release PR,
    # auto-merge, push, open release PR.
    #
    # The only thing normally breaking that cycle is release-plz finding
    # nothing to release on the second pass. zendriver-rs proved that is not
    # enough: on 2026-08-08 a malformed CHANGELOG.md made `changelog_update`
    # non-idempotent, so every pass produced a diff, read it as an unreleased
    # change, and cut another version. 44 empty releases and 26 crates.io
    # publishes later the workflow had to be disabled by hand.
    #
    # Matches both shapes the merge can take: a squash ("chore: release") and
    # a merge commit ("Merge pull request #N from .../release-plz-...").
    if: >-
      !startsWith(github.event.head_commit.message, 'chore: release') &&
      !contains(github.event.head_commit.message, '/release-plz-')
    steps:
      # Every action in these two files is pinned by commit, unlike test.yml's,
      # which use moving tags. These jobs hold RELEASE_PLZ_TOKEN and
      # CARGO_REGISTRY_TOKEN; test.yml's hold neither. A mutable tag in a job
      # with an upload token is a different risk from one in a job that only
      # runs tests.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # release-plz reads the commits since the last release tag, so a
          # shallow clone would give it nothing to write a changelog from.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # This action normally reads its toolchain from its own git ref, and
          # pinning by SHA replaces that ref with a hash it cannot parse. It
          # fails with "'toolchain' is a required input" rather than defaulting,
          # so the pin and this line go together.
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Pinned by commit, not by tag. This action is handed contents:write and
      # pull-requests:write, and a tag is mutable, so pinning the tag would
      # mean trusting whatever it points at later. This is the one place this
      # file deliberately does not match zendriver-rs, which pins `@v0.5.129`.
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          # Read-only here: `release-pr` does not upload, but release-plz uses
          # the registry to work out which versions are already published.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Second line of defence, independent of why a release PR appeared. A
      # release that changes no crate version is by definition a no-op, and it
      # was the zendriver loop's own tell: 15 consecutive changelog-only
      # "releases" ran while nothing was watching for exactly that shape.
      #
      # Block the MERGE, do not close the PR. The same changelog-only shape is
      # also produced legitimately, by a hand-edited version: release-plz then
      # has nothing left to bump and opens a PR carrying only the changelog
      # entry. shep is in exactly that state today, with main at 0.1.7 and the
      # newest tag v0.1.6. Leaving such a PR open and red puts a human in
      # front of the decision instead of guessing which case it is.
      - name: Refuse to auto-merge a release PR with nothing in it
        id: noop-guard
        if: ${{ steps.release-plz.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          PR_NUMBER: ${{ fromJSON(steps.release-plz.outputs.pr).number }}
        run: |
          # The version VALUE has to change, not merely appear in a file the
          # diff happens to touch. release-plz also rewrites intra-workspace
          # dependency versions inside Cargo.toml, so a path-presence test would
          # pass a pull request that bumps no package version at all.
          manifest_version() {
            gh api "repos/${GITHUB_REPOSITORY}/contents/Cargo.toml?ref=$1" \
              -H 'Accept: application/vnd.github.raw' \
              | grep -E '^[[:space:]]*version[[:space:]]*=' | tr -d '[:space:]'
          }
          base_sha="$(gh pr view "$PR_NUMBER" --json baseRefOid --jq .baseRefOid)"
          head_sha="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          if [ "$(manifest_version "$base_sha")" = "$(manifest_version "$head_sha")" ]; then
            echo "::error::release PR #$PR_NUMBER changes no version in Cargo.toml, so it will not be auto-merged."
            echo "::error::That is the no-op shape that looped on zendriver-rs on 2026-08-08, and also"
            echo "::error::what a hand-edited version leaves behind. Left open for a human: merge it if"
            echo "::error::the changelog entry is wanted, close it if this is a loop."
            exit 1
          fi
          # The other no-op shape, and the one that got through on 2026-08-27.
          # release-plz bumps the version even when every commit since the last
          # release was filtered out by release-plz-changelog.toml, which skips
          # docs, test, ci, chore and style. shep-deploy's release PR #1 was a
          # lone `ci:` commit and came out as `## [0.1.1]` with nothing under
          # it: a contentless version header, which is exactly what zendriver's
          # 44 empty releases looked like. The version test above passes it, and
          # correctly so: the bump is real. The changelog is what is empty.
          if ! gh pr diff "$PR_NUMBER" | grep -qE '^\+[-*] '; then
            echo "::error::release PR #$PR_NUMBER bumps a version but adds no changelog entry, so it will not be auto-merged."
            echo "::error::Every commit since the last release was filtered out by release-plz-changelog.toml."
            echo "::error::Left open for a human: close it, or land something worth releasing first."
            exit 1
          fi

      # Auto-merge so publishing stays hands-off: the merge pushes
      # "chore: release ..." to main, which triggers release-plz-release.yml.
      #
      # GH_TOKEN is the PAT, not GITHUB_TOKEN. A GITHUB_TOKEN-authored push
      # would not trigger the release workflow at all (GitHub's anti-recursion
      # rule), and a GITHUB_TOKEN-authored PR does not start its own checks,
      # so --auto would queue behind checks that never run.
      #
      # `gh pr merge --auto` queues the merge behind main's required status
      # checks, which the `main` ruleset defines. The `|| gh pr merge`
      # fallback covers the ruleset being absent.
      #
      # Do not read that gate as protection against a runaway loop. zendriver's
      # incident merged 44 release PRs straight through it, each waiting its
      # full green CI and getting it, because an empty release genuinely passes
      # every check. Required checks answer "is this branch broken", never
      # "should this exist". That question belongs to the job-level `if:` and
      # the no-op step above.
      #
      # Squash rather than zendriver-rs's `--merge`, and this one matters.
      # release-plz 0.3.160, which the pinned action runs, does not
      # necessarily release the commit it was handed: when that commit is a
      # MERGE commit it looks up the associated pull request, takes that PR's
      # last commit P, runs `git branch --contains P`, and on a hit runs a
      # literal `git checkout P` before packaging. So the tarball would be
      # built from the PR head rather than from what landed on main, and
      # anything that reached main while the release PR sat open would be
      # absent from it. A squash merge is a new commit with the branch
      # deleted, so `git branch --contains` finds nothing and release-plz
      # releases what is checked out. The old release-plz.yml carried a
      # dedicated step to refuse this case; squashing removes the case.
      - name: Auto-merge the release PR
        if: ${{ steps.release-plz.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          PR_NUMBER: ${{ fromJSON(steps.release-plz.outputs.pr).number }}
        run: |
          gh pr merge --auto --squash "$PR_NUMBER" \
            || gh pr merge --squash "$PR_NUMBER"
