name: pages
# Builds `web/` and publishes it to GitHub Pages, served at
# https://shep.turtlesocks.dev. The Pages source is set to "GitHub Actions"
# in the repository settings, and the custom domain lives there too — with
# an Actions-based deploy there is no `CNAME` file in the artifact.
#
# Unlike test.yml, this one runs on every push rather than by dispatch only.
# test.yml is gated because one run is 19 jobs, five of them on the macOS
# and Windows runners that bill at 10x and 2x on a private repo. This is a
# single ubuntu job of a couple of minutes at 1x, so the arithmetic that
# keeps the Rust CI manual does not reach it.
#
# The paths filter names three files outside `web/` on purpose: the site parses
# them at build time (see `web/src/data/*.ts`) rather than restating them, so
# that a stale claim fails the build instead of shipping. docs/specs/deferred.md
# feeds the "not built yet" chalkboard through web/src/data/chalkboard.ts, and
# docs/terminology.md feeds TWO consumers: the landing page's lexicon through
# web/src/data/lexicon.ts, and the terminology page's usage rules through
# web/src/data/docsRules.ts. Editing either file without redeploying would leave
# the site asserting something the repo no longer says.
#
# Cargo.toml is the newest of the three and is here for a sharper reason than
# the other two: it is the ONLY build input that a release changes. The CLI
# reference page prints the workspace version through
# web/src/data/workspaceVersion.ts, and a release commit touches nothing under
# `web/` -- so without this entry the release that bumps the version deploys
# nothing, and the published page goes on naming the version before it. That is
# the exact staleness the version was moved out of cli-reference.generated.txt
# to end, so leaving it out here would rebuild the defect one level up. The
# cost is that a dependency edit redeploys too: one ubuntu job, a couple of
# minutes, 1x.
#
# The terminology page's TABLE is a different thing and is not in this filter,
# because it comes from web/src/data/lexiconTable.md through
# web/src/data/docsLexicon.ts, and `web/**` already covers it.
#
# README.md was in this list too, until the lexicon table moved to
# web/src/data/lexiconTable.md, which happened because the README was rewritten
# as a landing page and the parser was left reading a heading that had gone.
# Nothing imports README.md now -- grep web/src for `?raw` for the real list --
# so it is no longer a build input and no longer belongs here.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/specs/deferred.md"
      - "docs/terminology.md"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight: a half-applied
# deploy is worse than a site that is a minute out of date.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # `npm ci` plus `astro build` is a couple of minutes. 15 is a ceiling
    # against a hang, not a budget. Both jobs here went without one while
    # every job in test.yml and release-artifacts.yml had one.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Reads web/.nvmrc, so the pinned version has exactly one home.
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Publishing an already-built artifact. Generous for what it does, and it
    # can wait on the `pages` concurrency group above.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
