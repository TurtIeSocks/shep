name: pages
# Builds `web/` and publishes it to GitHub Pages at https://shep-pm.com.
# Pages source and custom domain are both set in the repo settings; an
# Actions-based deploy ignores any `web/public/CNAME` file, and moving to a
# new owner still needs the domain re-set there by hand.
#
# Runs on every push rather than by dispatch only: one ubuntu job of a couple
# of minutes at 1x, unlike test.yml's macOS/Windows-heavy matrix.
#
# The paths filter also covers docs/specs/deferred.md, docs/terminology.md
# and Cargo.toml: the site parses each at build time (`web/src/data/*.ts`),
# and Cargo.toml is the only one of the three a release commit touches, for
# the workspace version the CLI reference page prints.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/specs/deferred.md"
      - "docs/terminology.md"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight: a half-applied
# deploy is worse than a site that is a minute out of date.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # `npm ci` plus `astro build` takes a couple of minutes; 15 is a ceiling
    # against a hang, not a budget.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Reads web/.nvmrc, so the pinned version has exactly one home.
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Publishing an already-built artifact. Generous for what it does, and it
    # can wait on the `pages` concurrency group above.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
