name: commits
# Rejects a pull request carrying a commit subject release-plz cannot parse.
#
# release-plz's `filter_unconventional = true` (release-plz-changelog.toml)
# drops any commit whose subject does not parse: no changelog entry, no
# version bump, even for a breaking change. `semver_check = true` does not
# catch that either; it has no lint for a changed return type.
#
# `.githooks/commit-msg` enforces the same rule locally, but core.hooksPath
# is per-clone, so this job is the actual gate.

on:
  pull_request:

permissions:
  contents: read

jobs:
  conventional:
    name: conventional subjects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: a subject is only checkable if it is fetched.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check every commit subject on this branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # --no-merges: release-plz ignores merge commits, so a `!` on a PR
          # title or merge subject never reaches it.
          #
          # No exemptions here, unlike the local hook: an unsquashed
          # fixup!/squash!/amend! commit and a `git revert` subject both parse
          # as nothing and get dropped like any other unreadable subject.
          #
          # git-cliff (release-plz-changelog.toml) gives feat/fix/perf/refactor
          # an entry, skips docs/test/ci/chore/style unless breaking, and
          # silently drops revert/build: neither matches a parser at all.
          #
          # `protect_breaking_commits` rescues a `!` on docs/chore as BREAKING,
          # but not on revert/build, which match no parser regardless of `!`;
          # refuse those two rather than accept a breaking change that would
          # be silently dropped.
          #
          # Scope allows any character except parentheses, per
          # git-conventional, so `feat(API): ...` is valid.
          bad=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            if printf '%s' "$subject" | grep -qE '^(feat|fix|perf|refactor|docs|test|ci|chore|style)(\([^()]+\))?!?: .+'; then
              printf '  ok      %s\n' "$subject"
            else
              printf '  DROPPED %s\n' "$subject"
              bad=$((bad + 1))
            fi
          done <<EOF
          $(git log --no-merges --format='%s' "$BASE..$HEAD")
          EOF

          if [ "$bad" -gt 0 ]; then
            cat >&2 <<MSG

          $bad commit subject(s) above will be dropped by release-plz.

          Each one contributes nothing to its crate's changelog and nothing to
          the version bump. If any of them changes a public API, that change
          ships inside a semver-compatible version and nothing reports it.

          Rewrite them as: type(optional-scope): lowercase summary

          Put a ! after the type or scope on the commit that actually breaks
          something, in the crate that breaks. A ! on this pull request's
          title does nothing, because release-plz never reads the merge commit.
          MSG
            exit 1
          fi
          echo "All $(git log --no-merges --oneline "$BASE..$HEAD" | wc -l | tr -d ' ') commit subject(s) are readable."
