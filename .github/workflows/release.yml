name: release
# Publishes the workspace to crates.io when a `v*` tag is pushed.
#
# Publishing is the one thing here that cannot be undone. A crate version can
# be yanked, which hides it from new resolutions, but it can never be replaced
# or removed, and the name-and-version pair is spent forever. So this file is
# built to refuse rather than to proceed: every check below runs before the
# first upload, and the dry run rehearses all five crates end to end.
#
# The order is not specified here on purpose. `cargo publish --workspace`
# computes it from the manifests and, unlike five separate `-p` runs, resolves
# the inter-member dependencies against the local workspace instead of
# demanding they already be on the index. docs/releasing.md has the reasoning.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  publish:
    runs-on: ubuntu-latest
    # Set this environment up with a required reviewer if you want a human
    # gate between pushing a tag and spending a version number.
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal

      - name: The tag and the manifest must agree
        # The guard worth having. A tag on the wrong commit, or a bump that
        # never reached `[workspace.package]`, publishes a version whose
        # contents are not what the tag says. Neither is recoverable, and
        # neither is visible in a green test run.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")"
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, Cargo.toml says $manifest" >&2
            exit 1
          fi

      # The test workflow ran on the commit. These run on the TAG, which is
      # not necessarily the same thing, and take minutes against a mistake
      # that lasts forever.
      #
      # Split into two tiers because a single `cargo test --workspace` is NOT
      # the same suite CI proves green, and using one here failed the first
      # real release. `boot.rs`'s two_concurrent_boots_on_a_stale_socket test
      # races two threads for a socket, and the `::slow::` tier waits on real
      # FSEvents and real elapsed time. A shared runner running the rest of
      # the suite alongside them cannot hold a wall clock still, so they fail
      # on contention rather than on anything being wrong. test.yml has always
      # split them out for exactly this reason; this file did not, and its
      # bare run was red on a commit whose own test workflow was green.
      #
      # Keep these two commands identical to test.yml's `test` and `slow`
      # jobs. If the skip list changes there, it changes here.
      - name: The gate, again, on the tag, minus the tests that need quiet
        run: 'cargo test --workspace --locked --all-features -- --skip ::slow:: --skip two_concurrent_boots'

      - name: And those tests, serially, with the machine to themselves
        run: 'cargo test --workspace --locked --all-features -- --test-threads=1 ::slow:: two_concurrent_boots'

      - name: Rehearse all five crates
        # Packages each crate and compiles it from its own tarball, which is
        # what catches a file the manifest forgot to include. Doing this after
        # the first upload would be too late for the crates already up.
        run: cargo publish --workspace --dry-run --locked

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked
