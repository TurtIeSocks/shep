name: release-plz
# Opens the release pull request, and publishes when it merges.
#
# Two jobs, in the order they happen. `release-pr` maintains a pull request
# that bumps versions from the conventional commits since the last release.
# `release` runs after that PR merges: it tags the commit, creates the GitHub
# release, and uploads to crates.io.
#
# This replaced a hand-written release.yml that published behind a `v*` tag.
# release-plz.toml records why that split was wrong.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Serialised per ref, and never cancelled mid-flight: a half-written
    # release PR is worse than a late one.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # release-plz reads the commits since the last release tag, so a
          # shallow clone would give it nothing to write a changelog from.
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal
      # Pinned by commit, not by tag. This action is handed contents:write
      # and pull-requests:write, and a tag is mutable, so pinning the tag
      # would mean trusting whatever it points at later. `v0` does not exist
      # anyway: this repository publishes only exact versions.
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          # Read-only here: `release-pr` does not upload, but release-plz uses
          # the registry to work out which versions are already published.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Runs on every push to main, and does nothing at all unless the manifest
  # names a version that is not yet on crates.io. That is what makes merging
  # the release PR the act that publishes: the merge is the only thing that
  # moves the version.
  #
  # Ordering across the five crates is release-plz's problem, not ours. It
  # reads the dependency graph and uploads in an order that resolves, which
  # is the same reason the old workflow used `cargo publish --workspace`
  # rather than five `-p` invocations.
  release:
    runs-on: ubuntu-latest
    # An environment, so a required reviewer can be added here later if this
    # ever wants a human gate between merging and spending a version number.
    environment: crates-io
    permissions:
      contents: write
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # As above: release-plz needs the history to know what is released.
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal
      # Same pin as the job above, for the same reason.
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
