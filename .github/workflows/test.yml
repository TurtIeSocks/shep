name: test
# Every Rust job carries `Swatinem/rust-cache@v2` after its toolchain
# install, so the key sees the toolchain that builds. `benches/` names it
# explicitly since it is its own workspace; `privileged`'s container ships
# a toolchain already.
#
# Every job carries `timeout-minutes`: a ceiling against a hang, not a
# performance budget, at roughly three times the last green runtime with a
# floor of ten minutes. GitHub's default when absent is 360.
#
# Every `uses:` is pinned by commit, and .github/dependabot.yml moves the
# pins. No secrets here, but a moved tag could rewrite the cache every job
# restores or the filter that decides whether the matrix runs at all.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# One run per ref. A newer push cancels a pull request's run, since the old
# head's verdict is no longer the question. A push to main cancels nothing:
# main's runs are the record the release workflows and the ruleset read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Decides which jobs below need the full Rust matrix. `typos` always runs
  # regardless, since it reads prose and a docs-only change edits exactly that.
  #
  # Skips at the JOB level (`needs` + `if`), not `on.push.paths`: a skipped
  # job still reports as "skipped", which satisfies a required check, while a
  # workflow filtered out by `paths:` never reports at all and a docs PR sits
  # at "Expected" forever. `test` and `features` are matrix jobs, so they gate
  # every step instead: a job-level skip never expands the matrix, and the
  # required contexts are the per-leg names.
  #
  # Every gated `if:` also runs on `needs.changes.result != 'success'`, so a
  # failed filter runs the full matrix rather than skipping everything.
  #
  # `docs/whistle/tools.md` and `docs/lookout/frames.*` count as `rust`: Rust
  # tests pin both.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      bench: ${{ steps.filter.outputs.bench }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pinned by commit, not a moving tag: this action's output decides
      # whether any test runs at all, so a moved tag could silently skip the
      # whole matrix.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/test.yml'
              - 'docs/whistle/tools.md'
              - 'docs/lookout/frames.txt'
              - 'docs/lookout/frames.ansi'
              # cargo-deny's config, and the report that runs after every
              # nextest leg. A change to either is a change to what the
              # Rust jobs do.
              - 'deny.toml'
              - '.github/actions/**'
            # benches/ is its own workspace, excluded from the root one, so
            # the main matrix never compiles it and only the bench job below
            # cares when it changes.
            bench:
              - 'benches/**'
            # Feeds both the `packaging` job (Chocolatey) and the `formula`
            # job (Homebrew). Neither compiles Rust, so neither belongs on the
            # `rust` filter.
            packaging:
              - 'packaging/**'
              - '.github/workflows/test.yml'
  # Parses the Chocolatey package's PowerShell and nuspec; nothing else here
  # reads them, and `release-artifacts.yml`'s `chocolatey` job only does at
  # release time.
  #
  # A parse, not an execution: the scripts call Chocolatey helper functions
  # that only exist inside a real install.
  packaging:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.packaging == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          Get-ChildItem packaging -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              $errors | ForEach-Object { Write-Host "::error::$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "ok $($_.FullName)"
            }
          }
          if ($failed) { throw 'PowerShell parse errors' }
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem packaging -Recurse -Filter *.nuspec | ForEach-Object {
            [xml](Get-Content $_.FullName -Raw) | Out-Null
            Write-Host "ok $($_.FullName)"
          }
  # `brew style` on the Homebrew formula; nothing else parses it.
  #
  # Copied to `Formula/` first: Homebrew's rubocop keys several cops off the
  # path, and linting `packaging/homebrew/shep.rb` in place reports a
  # `Style/FrozenStringLiteralComment` offense no real formula has.
  formula:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.packaging == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          mkdir -p tap/Formula
          cp packaging/homebrew/shep.rb tap/Formula/shep.rb
          brew style "$PWD/tap/Formula/shep.rb"
  lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install 1.93 --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +1.93 fmt --all -- --check
      # `--all-features` mirrors the project's own task gate (CLAUDE.md).
      # Without it, everything behind shep-daemon's `test-fakes` feature is
      # unlinted, and clippy's whole value here is that it sees what the
      # local gate sees.
      - run: cargo +1.93 clippy --workspace --all-targets --all-features -- -D warnings
  docs:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +nightly doc --workspace --all-features --no-deps
        env: { RUSTDOCFLAGS: "-Dwarnings --cfg docsrs" }
  typos:
    # Compiles nothing, so the floor is the whole value here.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1
  test:
    needs: changes
    # `!cancelled()` only: without it, a failed `changes` job skips this job
    # before matrix expansion, losing the per-leg required checks. Steps gate
    # on `result != 'success'` instead of `!cancelled()`, since on a step that
    # would replace the implicit `success()` and run `cargo test` after a
    # failed toolchain install.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        # `ubuntu-24.04-arm` catches linux/arm64-only breaks (shep-client's
        # handshake-close test was red there for phases) at the standard
        # Linux runner price, not the macOS/Windows multiplier.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        toolchain: [stable, "1.88"]
    runs-on: ${{ matrix.os }}
    # `timeout-minutes` applies per matrix leg, so it is sized from the
    # slowest one: `windows-latest` / stable, 355s on the last green run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      # `--all-features` mirrors the task gate (CLAUDE.md).
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with: { tool: nextest }
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - run: "cargo +${{ matrix.toolchain }} nextest run --profile ci --workspace --locked --all-features -E 'not (test(::slow::) or test(two_concurrent_boots) or test(signal_ignored_then_kill_tree_reaps) or test(a_reload_costs_a))'"
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      # nextest does not run doctests at all, so they need their own line
      # or they stop running on this platform. 14 of them, 6.8s warm.
      - run: 'cargo +${{ matrix.toolchain }} test --workspace --locked --all-features --doc'
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      # `!cancelled()`: this runs after a failed test step, when the junit is
      # worth reading; after a failed toolchain install it finds no file.
      - uses: ./.github/actions/nextest-report
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
        with:
          name: junit-test-${{ matrix.os }}-${{ matrix.toolchain }}
  minimal-versions:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # Resolves a whole second lockfile before it builds anything, so it never
    # gets the cache hit the other Linux jobs do.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install nightly stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +nightly generate-lockfile -Z minimal-versions
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with: { tool: nextest }
      - run: "cargo +stable nextest run --profile ci --workspace -E 'not (test(::slow::) or test(two_concurrent_boots) or test(signal_ignored_then_kill_tree_reaps) or test(a_reload_costs_a))'"
      - run: 'cargo +stable test --workspace --doc'
      - uses: ./.github/actions/nextest-report
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
        with:
          name: junit-minimal-versions
  musl:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # Builds the whole tree for a second target, from cold, on the first run
    # of a branch.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # `--test-threads 2`: musl's allocator is markedly slower than glibc's
      # under `cli_e2e`'s roughly ninety real shepherd/sheep spawns, so full
      # parallelism reports scheduling delay as a product failure. Two, not
      # one: this is contention, not a wall-clock tier like `slow`, and the
      # job has headroom against its twenty-minute timeout.
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with: { tool: nextest }
      - run: "cargo nextest run --profile ci --workspace --locked --target x86_64-unknown-linux-musl --test-threads 2 -E 'not (test(::slow::) or test(two_concurrent_boots) or test(signal_ignored_then_kill_tree_reaps) or test(a_reload_costs_a))'"
      - run: 'cargo test --workspace --locked --target x86_64-unknown-linux-musl --doc'
      - uses: ./.github/actions/nextest-report
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
        with:
          name: junit-musl
  # `cargo check`, not clippy: shep-daemon's unix-gated `boot`/`sys`/
  # `server`/`tokio_runner` report 51 dead-code warnings on this target that
  # are not dead on any platform shep ships, and silencing them would need
  # `#[allow(dead_code)]` on live code. This job only asks whether the tree
  # still compiles for the target.
  #
  # Cross-compiled from ubuntu-latest: `ring`'s build script needs a real
  # GNU `cc`, which MSVC's `cl.exe` cannot supply, and the resulting binary
  # cannot run on Linux either way, so this stays `check` rather than
  # `test`. `test`'s own `windows-latest` legs already exercise the MSVC
  # target with a real `cargo test`.
  windows-gnu:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # 39s on the last green run; the floor is doing all the work.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: cargo check --workspace --all-targets --all-features --locked --target x86_64-pc-windows-gnu
  features:
    needs: changes
    # `!cancelled()` only: without it, a failed `changes` job skips this job
    # before matrix expansion, losing the per-leg required checks. Steps
    # gate on `result != 'success'` instead.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The slowest job in the file: two full test runs back to back, 414s on
    # `windows-latest` last time it was green.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - run: rustup toolchain install stable --profile minimal
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with: { tool: nextest }
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - run: "cargo nextest run --profile ci -p shep-daemon --locked --no-default-features -E 'not (test(::slow::) or test(two_concurrent_boots) or test(signal_ignored_then_kill_tree_reaps) or test(a_reload_costs_a))'"
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      # This job runs nextest twice under the one `ci` profile, and both
      # runs write the same junit path, so the second overwrites the first
      # before anything reads it. One report per run, named for its tier.
      - uses: ./.github/actions/nextest-report
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
        with:
          name: junit-features-${{ matrix.os }}-daemon-no-default-features
      - run: 'cargo test -p shep-daemon --locked --no-default-features --doc'
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      # shep-client's `schema` feature defaults on; a dog can turn it off,
      # so the opt-out needs its own leg. `cargo test`, not `check`: the
      # doctest broke under this feature set too, and only a test run reads it.
      - run: cargo test -p shep-client --locked --no-default-features
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - run: "cargo nextest run --profile ci --workspace --locked --all-features -E 'not (test(::slow::) or test(two_concurrent_boots) or test(signal_ignored_then_kill_tree_reaps) or test(a_reload_costs_a))'"
        id: all-features
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - run: 'cargo test --workspace --locked --all-features --doc'
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      # Only once the workspace run has run: after a red first tier it is
      # skipped and the junit on disk is still the first tier's.
      - uses: ./.github/actions/nextest-report
        if: ${{ !cancelled() && steps.all-features.outcome != 'skipped' && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
        with:
          name: junit-features-${{ matrix.os }}
  # Runs serially on a quiet machine: `::slow::` waits on real FSEvents/
  # inotify delivery and real elapsed time, the boot race asserts exactly
  # one of two threads wins for one `$SHEP_HOME`, the signal test gives a
  # shell 100ms to install a trap before signalling it, and the reload pair
  # asserts a connection count across a fixture window that closes its
  # listener only after `accept` returns `WouldBlock`, which a busy machine
  # can widen past an already-queued connection. Not `#[ignore]`d: every
  # other job just skips them.
  #
  # One leg per watcher backend; no second Linux leg, since arm exercises
  # the same inotify. Stable only. `--workspace`, so a `mod slow` outside
  # shep-daemon is not skipped everywhere and run nowhere. Windows: the
  # boot and reload filters match nothing, both `cfg(unix)`.
  slow:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # 143s on `windows-latest`, but every test here waits on a real clock and
    # runs single-threaded, so this one gets more headroom than 3x.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with: { tool: nextest }
      - run: "cargo nextest run --profile ci-slow --workspace --locked --all-features -E 'test(::slow::) or test(two_concurrent_boots) or test(signal_ignored_then_kill_tree_reaps) or test(a_reload_costs_a)'"
      - uses: ./.github/actions/nextest-report
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
        with:
          name: junit-slow-${{ matrix.os }}
          profile: ci-slow
  # `cargo llvm-cov`'s default `--tests` skips examples, and two of
  # `daemon_e2e`'s reload tests exec `examples/reuse_port_sheep`, the
  # SO_REUSEPORT fixture the reload measurement rests on. `--all-targets`
  # does not help: it compiles examples in test mode into `deps/` rather
  # than a plain binary in `examples/`, which is where the test looks.
  #
  # So this drives llvm-cov by hand: `show-env` exports the profiling
  # wrapper, an ordinary `cargo test` builds the example the same way every
  # other job does, and `report` reads the profile data after.
  coverage:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # Instrumented builds are the slowest thing on Linux here, and this job
    # also installs a tool before it starts.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install stable --profile minimal --component llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        # Block style: in a flow mapping the comma is YAML's separator, so
        # `{ tool: a,b }` installs `a` and passes a stray `b` key.
        with:
          tool: cargo-llvm-cov,nextest
      - run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace
          cargo nextest run --profile ci --workspace --locked --all-features -E 'not (test(::slow::) or test(two_concurrent_boots) or test(signal_ignored_then_kill_tree_reaps) or test(a_reload_costs_a))'
          cargo llvm-cov report --lcov --output-path lcov.info
      - uses: ./.github/actions/nextest-report
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
        with:
          name: junit-coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: coverage, path: lcov.info }
  # cargo-deny against deny.toml: RustSec advisories, licences, duplicate
  # versions and sources. On the `rust` filter, which includes Cargo.lock
  # and deny.toml, so a Dependabot bump gets it too. Ten minutes is a
  # ceiling; the check runs in under one.
  deny:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # `[graph] all-features = true` in deny.toml already covers the
          # feature set; this is the action's own default, stated so it
          # cannot drift from the file.
          arguments: --all-features
  bench:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.bench == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    # `benches/` is its own `[workspace]`, excluded from the root one so a
    # bench-only dependency can never end up in a shipped binary's tree.
    # `test`'s `1.88` matrix leg never touches it, so this job carries its
    # own two-toolchain matrix to check `benches/Cargo.toml`'s MSRV floor.
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.88"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: benches }
      # `--test` runs each benchmark once and asserts nothing: the point on a
      # shared runner is proving the harness compiles and executes, not
      # collecting a timing.
      - run: cargo +${{ matrix.toolchain }} bench --manifest-path benches/Cargo.toml -- --test
  privileged:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    # `real_runner.rs`'s privilege-drop case needs a real uid change and a
    # real supplementary-group clear, both root-only.
    #
    # A container, not `sudo` on the runner: the daemon has to actually
    # start as root to prove it can drop to `nobody` and that std cleared
    # root's supplementary groups on the way.
    runs-on: ubuntu-latest
    # One test, but the container has to build shep-daemon's test tier to get
    # to it.
    timeout-minutes: 20
    container:
      image: rust:1.88
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `--exact` on this one test, not a bare `--ignored`: the workspace's
      # other two `#[ignore]`s are child halves of cross-process race tests,
      # re-exec'd by their own parents, and assert nothing on their own.
      - run: >
          cargo test -p shep-daemon --test real_runner --locked --all-features
          -- --ignored --exact a_dropped_child_runs_as_the_requested_user

