name: test
# Runs automatically on pushes to main and on pull requests, by the maintainer's call on
# 2026-08-16.
#
# The repository is public, so these runs are free regardless of job count or
# platform. That was not always true, and docs/specs/deferred.md keeps the
# billing arithmetic (GitHub charges private-repo Actions minutes per
# platform: Linux 1x, Windows 2x, macOS 10x) for the day it might matter
# again.
#
# The weekly `schedule: [{ cron: "0 0 * * SUN" }]` the earlier comment listed
# is deliberately NOT enabled: a full matrix run every week against an
# unchanged tree spends the most expensive part of this file to learn nothing.
# Worth adding if dependency rot against an idle tree becomes a real concern —
# that decision is the maintainer's, not made here just because the runs are free.
#
# Every job that compiles Rust carries `Swatinem/rust-cache@v2`, placed after
# its `rustup toolchain install` so the cache key picks up the toolchain that
# will actually build. There was no caching here at all until 2026-08-27, so
# all twelve jobs rebuilt the whole dependency tree from scratch on every push,
# and the Windows legs paid for it worst: a run that should take four minutes
# stalled past fifty. `benches/` is its own workspace with its own target dir,
# so that leg names it explicitly; `privileged` installs no toolchain because
# its container ships one.
#
# Cache scope is per-branch, so the first run on a new PR is still cold. The
# win is the second and every push after it, which is the shape of most work
# here.
#
# Every job also carries `timeout-minutes`. These are ceilings against a hang,
# NOT performance budgets: each is roughly three times the job's runtime on
# the last green run, rounded up, with a floor of ten minutes so a cold cache
# on a fresh branch cannot trip one. A job that gets slower is not what this
# file is trying to catch; a job that stops making progress is.
#
# GitHub's default when the key is absent is 360 minutes, which is why the
# omission was expensive rather than merely untidy. Three runs on 2026-08-27
# were cancelled by hand at 40-plus minutes each because a Windows test hung
# and nothing here bounded it -- left alone, the first would have held a
# runner for six hours before Actions said a word. Add a job below and give it
# a timeout, whatever else you do.
#
# Every `uses:` is pinned by commit, with the version it was pinned at in a
# comment beside it, and .github/dependabot.yml moves the pins. Until
# 2026-09-04 this file used moving tags (`@v4`, `@v1`, and
# `taiki-e/install-action@nextest`, which is a branch) on the argument that
# it holds no secrets. It holds no secrets and it still decides what a pull
# request is allowed to claim: an action that can be rewritten under a tag
# can rewrite the cache every job here restores, or the filter output that
# decides whether the matrix runs at all. The release workflows pinned from
# the start for a narrower reason; this file now matches them, and the pin
# is free to keep because a bot moves it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# One run per ref at a time. On a pull request a newer push cancels the run
# it supersedes, because the old head's verdict is no longer the question:
# measured over every run to 2026-09-04, 565 of them, 17 were cancelled by
# hand for exactly that reason and the rest of the superseded ones ran to
# the end for nothing. A push to main cancels nothing, and never queues behind a
# pull request, since the group carries the ref: main's runs are the record
# the release workflows and the ruleset read, and a cancelled one there is
# a gap in it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Decides which of the jobs below a change actually needs, so a docs-only
  # pull request stops paying for the full Rust matrix. Everything below
  # except `typos` is gated on this job's `rust` output; `typos` reads prose,
  # which is exactly what a docs-only change edits, so it always runs.
  #
  # The skip lives at the JOB level (`needs` + `if`) and deliberately NOT at
  # the workflow level (`on.push.paths`), and the difference is the `main`
  # ruleset. A job skipped by its `if:` still reports, as "skipped", which
  # SATISFIES a required status check. A workflow filtered out by `paths:`
  # never reports at all, so every required check sits at "Expected" forever
  # and a docs pull request can never merge. Same feature, opposite outcomes.
  #
  # EXCEPT for a matrix job, and the canary run for this gate is what proved
  # it: a matrix job skipped at the job level never expands its matrix, so it
  # reports one check run named `test`, and the ruleset's required contexts
  # are the per-leg names, `test (ubuntu-latest, stable)` and friends. Those
  # never get created and sit at "Expected" forever, which is the docs-PR
  # deadlock again through a side door. So the two matrix jobs with required
  # legs, `test` and `features`, gate every STEP instead of the job: each leg
  # spins up, skips its steps in seconds, and reports SUCCESS under its own
  # required name. Every non-matrix job keeps the job-level skip, which the
  # same canary showed the ruleset accepting.
  #
  # The fail-open corner is closed in the gate expression itself, not in the
  # ruleset. If this job errors its outputs are empty, and a naive gate would
  # skip every job while skipped-counts-as-success waves the pull request
  # through with nothing run. So every gated `if:` also runs on
  # `needs.changes.result != 'success'`: a filter failure runs the FULL
  # matrix, which is the pre-gate behaviour and the safe direction. The
  # `!cancelled()` prefix is what lets a job with a failed dependency run at
  # all; without it, GitHub skips dependants of a failed job before reading
  # their condition.
  #
  # Three docs paths count as RUST on purpose, because Rust tests pin them:
  # `docs/whistle/tools.md` is read at test runtime by whistle::catalogue's
  # `the_checked_in_catalogue_is_current`, and the two `docs/lookout/frames.*`
  # files are the lookout deliverables whose renderer is snapshot-pinned.
  # Editing any of them without the suite is how they drift.
  #
  # `workflow_dispatch` runs everything regardless: someone pressing the
  # button by hand is asking for the full matrix, and the paths-filter action
  # has no pull request to diff there anyway.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      bench: ${{ steps.filter.outputs.bench }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Every action in this file is pinned by commit (see the header), and
      # this one would deserve it alone: this workflow holds no secrets, but
      # this action's OUTPUT decides whether any test runs at all, so a
      # moved tag here could silently skip the whole matrix rather than
      # merely run different action code.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/test.yml'
              - 'docs/whistle/tools.md'
              - 'docs/lookout/frames.txt'
              - 'docs/lookout/frames.ansi'
              # cargo-deny's config, and the report that runs after every
              # nextest leg. A change to either is a change to what the
              # Rust jobs do.
              - 'deny.toml'
              - '.github/actions/**'
            # benches/ is its own workspace, excluded from the root one, so
            # the main matrix never compiles it and only the bench job below
            # cares when it changes.
            bench:
              - 'benches/**'
            # Feeds both the `packaging` job (Chocolatey) and the `formula`
            # job (Homebrew). Neither compiles Rust, so neither belongs on the
            # `rust` filter.
            packaging:
              - 'packaging/**'
              - '.github/workflows/test.yml'
  # Parses the Chocolatey package's PowerShell and its nuspec, on a runner
  # that has both. Neither is compiled by anything else here, and the only
  # other thing that reads them is `release-artifacts.yml`'s `chocolatey`
  # job, which runs once per release and pushes straight to a moderation
  # queue. A syntax error found there is found in public, days later.
  #
  # A parse, not an execution: the scripts call Chocolatey helper functions
  # that only exist inside a real install.
  packaging:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.packaging == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          Get-ChildItem packaging -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              $errors | ForEach-Object { Write-Host "::error::$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "ok $($_.FullName)"
            }
          }
          if ($failed) { throw 'PowerShell parse errors' }
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem packaging -Recurse -Filter *.nuspec | ForEach-Object {
            [xml](Get-Content $_.FullName -Raw) | Out-Null
            Write-Host "ok $($_.FullName)"
          }
  # `brew style` on the Homebrew formula, which is rubocop with Homebrew's own
  # cops. Same argument as the `packaging` job above: nothing else parses this
  # file, and the only other thing that reads it is the release-time push to
  # the tap.
  #
  # The formula is copied to a `Formula/` directory first, which is not
  # ceremony. Homebrew's rubocop config keys several cops off the path, so
  # linting `packaging/homebrew/shep.rb` in place reports a
  # `Style/FrozenStringLiteralComment` offense that no formula in a real tap
  # has or wants.
  formula:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.packaging == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          mkdir -p tap/Formula
          cp packaging/homebrew/shep.rb tap/Formula/shep.rb
          brew style "$PWD/tap/Formula/shep.rb"
  lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install 1.93 --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +1.93 fmt --all -- --check
      # `--all-features` mirrors the project's own task gate (CLAUDE.md).
      # Without it, everything behind shep-daemon's `test-fakes` feature is
      # unlinted, and clippy's whole value here is that it sees what the
      # local gate sees.
      - run: cargo +1.93 clippy --workspace --all-targets --all-features -- -D warnings
  docs:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +nightly doc --workspace --all-features --no-deps
        env: { RUSTDOCFLAGS: "-Dwarnings --cfg docsrs" }
  typos:
    # Compiles nothing, so the floor is the whole value here.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1
  test:
    needs: changes
    # `!cancelled()` and nothing else. Without it, a FAILED `changes` job
    # skips this job before matrix expansion, and the per-leg required checks
    # go missing again through the one path the step gates cannot reach. With
    # it, the legs always expand, and a failed filter makes every step's
    # `result != 'success'` term true, so the full suite runs: fail closed,
    # same as the job-level gates. The steps themselves deliberately do NOT
    # carry `!cancelled()`; on a step it replaces the implicit `success()`,
    # which would run `cargo test` after a failed toolchain install.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        # `ubuntu-24.04-arm` is the leg that matters most and the one this
        # matrix went nine phases without: shep-client's handshake-close test
        # was red on linux/arm64 for five phases (platform audit #1) and
        # nothing here would have said so. Billed as a standard Linux runner,
        # not at the macOS/Windows multiplier.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        toolchain: [stable, "1.88"]
    runs-on: ${{ matrix.os }}
    # `timeout-minutes` applies per matrix leg, so it is sized from the
    # slowest one: `windows-latest` / stable, 355s on the last green run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      # `--all-features` mirrors the task gate, as in `lint` above.
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with: { tool: nextest }
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - run: "cargo +${{ matrix.toolchain }} nextest run --profile ci --workspace --locked --all-features -E 'not (test(::slow::) or test(two_concurrent_boots) or test(signal_ignored_then_kill_tree_reaps) or test(a_reload_costs_a))'"
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      # nextest does not run doctests at all, so they need their own line
      # or they stop running on this platform. 14 of them, 6.8s warm.
      - run: 'cargo +${{ matrix.toolchain }} test --workspace --locked --all-features --doc'
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      # `!cancelled()` on purpose, and only here: this step must run after
      # a FAILED test step, since that is when the junit is worth reading,
      # and it is harmless after a failed toolchain install, because the
      # report finds no file and says so.
      - uses: ./.github/actions/nextest-report
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
        with:
          name: junit-test-${{ matrix.os }}-${{ matrix.toolchain }}
  minimal-versions:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # Resolves a whole second lockfile before it builds anything, so it never
    # gets the cache hit the other Linux jobs do.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install nightly stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +nightly generate-lockfile -Z minimal-versions
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with: { tool: nextest }
      - run: "cargo +stable nextest run --profile ci --workspace -E 'not (test(::slow::) or test(two_concurrent_boots) or test(signal_ignored_then_kill_tree_reaps) or test(a_reload_costs_a))'"
      - run: 'cargo +stable test --workspace --doc'
      - uses: ./.github/actions/nextest-report
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
        with:
          name: junit-minimal-versions
  musl:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # Builds the whole tree for a second target, from cold, on the first run
    # of a branch.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # `--test-threads=2`, and the reason is musl rather than this job's
      # own tests. `cli_e2e` spawns a real shepherd and real sheep per case,
      # roughly ninety of them, and libtest runs them at one thread per core.
      # musl's allocator is markedly slower than glibc's under exactly that
      # load, so a suite that fits its budgets everywhere else does not fit
      # them here: a case that waits twenty seconds for a line its child
      # never got scheduled to write reports as a product failure.
      #
      # Twice now, and both times the triage cost more than the fix. The
      # second was worse, because the branch it failed on was changing
      # restart timing and the failure could not be dismissed until the log
      # arrived.
      #
      # Two rather than one: this is a contention problem, not a wall-clock
      # tier like `slow`, so the storm wants capping rather than the suite
      # serialising. The number is a judgement call and the headroom is
      # large, since this job has been running 132 to 185 seconds against a
      # twenty-minute timeout. If it flakes here again, one is affordable.
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with: { tool: nextest }
      - run: "cargo nextest run --profile ci --workspace --locked --target x86_64-unknown-linux-musl --test-threads 2 -E 'not (test(::slow::) or test(two_concurrent_boots) or test(signal_ignored_then_kill_tree_reaps) or test(a_reload_costs_a))'"
      - run: 'cargo test --workspace --locked --target x86_64-unknown-linux-musl --doc'
      - uses: ./.github/actions/nextest-report
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
        with:
          name: junit-musl
  # CLAUDE.md's phase-gate cross-check
  # (`cargo check --workspace --all-targets --all-features --target
  # x86_64-pc-windows-gnu`) had no workflow behind it, so it only ran when a
  # human remembered -- and it went three phases unrun that way before Phase
  # 10 caught it (docs/specs/deferred-history.md, "the windows-gnu cross-check
  # went three phases unrun"). It is `cargo check`, deliberately, not
  # `clippy -- -D warnings`: shep-daemon's `boot`/`sys`/`server`/
  # `tokio_runner` are `cfg(unix)`-gated, so the Windows target reports 51
  # dead-code warnings for code that is not dead on any platform shep ships.
  # Silencing them would mean `#[allow(dead_code)]` on live code. The
  # question this job asks is only whether the tree still compiles for a
  # target nobody has implemented yet.
  #
  # Cross-compiled from ubuntu-latest rather than run natively on
  # windows-latest: `ring`'s build script needs a real GNU `cc` for this
  # target regardless of host OS -- MSVC's `cl.exe` cannot produce it -- and
  # `apt-get install mingw-w64` supplies one in seconds, the same shape the
  # `musl` job above already uses for its own cross target. A GNU-target
  # binary cross-compiled on Linux cannot be executed there either way, which
  # is the other reason this stays `check` rather than `test`. The `test`
  # job's own `windows-latest` legs already give the MSVC target full
  # `cargo test` execution on native Windows; this job's only job is the GNU
  # target's compile-time coverage.
  windows-gnu:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # 39s on the last green run; the floor is doing all the work.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: cargo check --workspace --all-targets --all-features --locked --target x86_64-pc-windows-gnu
  features:
    needs: changes
    # `!cancelled()` and nothing else. Without it, a FAILED `changes` job
    # skips this job before matrix expansion, and the per-leg required checks
    # go missing again through the one path the step gates cannot reach. With
    # it, the legs always expand, and a failed filter makes every step's
    # `result != 'success'` term true, so the full suite runs: fail closed,
    # same as the job-level gates. The steps themselves deliberately do NOT
    # carry `!cancelled()`; on a step it replaces the implicit `success()`,
    # which would run `cargo test` after a failed toolchain install.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The slowest job in the file: two full test runs back to back, 414s on
    # `windows-latest` last time it was green.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - run: rustup toolchain install stable --profile minimal
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with: { tool: nextest }
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - run: "cargo nextest run --profile ci -p shep-daemon --locked --no-default-features -E 'not (test(::slow::) or test(two_concurrent_boots) or test(signal_ignored_then_kill_tree_reaps) or test(a_reload_costs_a))'"
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - run: 'cargo test -p shep-daemon --locked --no-default-features --doc'
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      # shep-client's `schema` feature is ON by default and a dog is
      # allowed to turn it off, so the opt-out needs a leg of its own: the
      # shep-daemon line above says nothing about it. Without one, the
      # crate's `#[cfg(test)] mod tests` named `schemars` in a build that
      # has no schemars and nothing noticed, because the task gate is
      # `--all-features`. `cargo test` rather than `cargo check`, both to
      # match the line above and because the doctest was broken the same
      # way and only a doctest run reads it.
      - run: cargo test -p shep-client --locked --no-default-features
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - run: "cargo nextest run --profile ci --workspace --locked --all-features -E 'not (test(::slow::) or test(two_concurrent_boots) or test(signal_ignored_then_kill_tree_reaps) or test(a_reload_costs_a))'"
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - run: 'cargo test --workspace --locked --all-features --doc'
        if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch' }}
      - uses: ./.github/actions/nextest-report
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
        with:
          name: junit-features-${{ matrix.os }}
  # Tests that need a quiet machine, run serially in a job of their own.
  #
  # Two groups belong here and neither is a flaky test in the usual sense:
  # both assert something real that a contended runner cannot hold still for.
  # The `::slow::` modules wait on actual FSEvents/inotify delivery and actual
  # elapsed time, so an assertion like "writes inside `delay` land in one
  # batch" is measuring the debouncer against a wall clock that a noisy
  # neighbour can stretch. `two_concurrent_boots_on_a_stale_socket_exactly_one_wins`
  # races two threads for the same $SHEP_HOME and asserts exactly one wins,
  # which depends on the loser looking after the winner has bound.
  # `signal_ignored_then_kill_tree_reaps` is the same shape: it gives a shell
  # 100ms to install `trap "" TERM` before signalling it, then asserts the
  # process survived, so a runner that cannot schedule that shell inside the
  # window reports a working trap as a broken one. The test's own comment
  # names the race. Seen failing once on macos/1.88 while passing five of
  # five locally at 0.41s each.
  #
  # `a_reload_costs_a` is a prefix, and it matches exactly the two halves of
  # the reload measurement: the draining app and the defiant one. Each reloads
  # a `reuse_port_sheep` while a caller opens a connection every 4ms, and each
  # asserts a COUNT rather than a duration -- the drainer must lose nothing,
  # the defier must be seen to lose something. No millisecond budget appears
  # in either, which is why they did not look like timing tests, and both are.
  # The fixture closes its listener only once `accept` has returned
  # `WouldBlock` with the stop flag set, so a connection the kernel queues
  # between those two instructions is reset when the fd closes. That window is
  # microseconds wide on a quiet machine and as wide as a descheduled thread
  # on a busy one, and no socket API makes the two steps atomic. Three
  # failures in the eighteen days to 2026-09-03, all on Linux, all the same
  # cause pointing opposite ways: the drainer lost 1 of 109 and 1 of 111 to
  # `Connection reset by peer`, and the defier lost 0 of 297 when it needs to
  # lose at least one.
  #
  # Every other job skips these groups so the matrix stays fast and honest.
  # This job runs them with `--test-threads=1` so the only load is their own.
  # They are NOT `#[ignore]`d: the tier's own doc says it exists so the full
  # suite covers the real backend, and this project has already found a Linux
  # branch that went five phases without a compiler reading it.
  #
  # One leg per watcher backend -- FSEvents, inotify, ReadDirectoryChangesW --
  # since for the `::slow::` tier the backend is the thing under test. No
  # second Linux leg: the arm runner would exercise the same inotify, and for
  # the reload pair the same kernel's SO_REUSEPORT balancing. That does cost
  # the reload pair the leg two of its three failures came from, which was the
  # slowest Linux runner rather than a different Linux, and running serially
  # is what those failures needed. Stable only, for the same reason; the
  # compiler is not what varies here. `--workspace`, matching the skip the
  # other jobs apply, so a `mod slow` added outside shep-daemon later cannot
  # end up skipped everywhere and run nowhere.
  #
  # libtest takes these filters positionally, so this is one command. On
  # Windows the boot and reload halves both match nothing, because `boot.rs`'s
  # tests and `daemon_e2e`'s reload pair are `cfg(unix)` -- that is the
  # platform split, not a filter typo.
  slow:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # 143s on `windows-latest`, but every test here waits on a real clock and
    # runs single-threaded, so this one gets more headroom than 3x.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with: { tool: nextest }
      - run: "cargo nextest run --profile ci-slow --workspace --locked --all-features -E 'test(::slow::) or test(two_concurrent_boots) or test(signal_ignored_then_kill_tree_reaps) or test(a_reload_costs_a)'"
      - uses: ./.github/actions/nextest-report
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
        with:
          name: junit-slow-${{ matrix.os }}
          profile: ci-slow
  # `cargo llvm-cov` on its own runs `cargo test --tests`, and `--tests` does
  # not build a package's examples. Four of `daemon_e2e`'s reload tests exec
  # `examples/reuse_port_sheep`, the SO_REUSEPORT fixture the whole reload
  # measurement rests on, and fail without it. The two counting ones moved to
  # `slow` above and this job skips them now, so the reason this job still
  # needs the example is the other two: a probed reload of a release that
  # serves, and of one that does not. `--all-targets` does not help:
  # it compiles examples in test mode into `deps/` rather than uplifting a
  # plain binary into `examples/`, which is the path the test looks in.
  #
  # So this drives llvm-cov by hand instead. `show-env` exports the wrapper and
  # profile settings, an ordinary `cargo test` builds examples the same way
  # every other job does, and `report` reads the profile data afterwards.
  #
  # The bug is older than the `slow` split above and was hidden by it: cargo
  # stops at the first failing test binary, and the lib tier used to fail
  # first, so this job never reached `daemon_e2e`.
  coverage:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # Instrumented builds are the slowest thing on Linux here, and this job
    # also installs a tool before it starts.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install stable --profile minimal --component llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        # Block style on purpose. In a flow mapping the comma is YAML's own
        # separator, so `{ tool: cargo-llvm-cov,nextest }` installs llvm-cov
        # and hands the action a stray `nextest` key: measured as
        # `error: no such command: nextest` on the first run of this pin.
        with:
          tool: cargo-llvm-cov,nextest
      - run: |
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace
          cargo nextest run --profile ci --workspace --locked -E 'not (test(::slow::) or test(two_concurrent_boots) or test(signal_ignored_then_kill_tree_reaps) or test(a_reload_costs_a))'
          cargo llvm-cov report --lcov --output-path lcov.info
      - uses: ./.github/actions/nextest-report
        if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
        with:
          name: junit-coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: coverage, path: lcov.info }
  # cargo-deny against deny.toml: RustSec advisories, licences, duplicate
  # versions and sources. The advisory half is the one nothing else here
  # does; `cargo audit` was installed on one machine and run by nobody. It
  # runs on the `rust` filter, which includes Cargo.lock and deny.toml, so a
  # lockfile-only pull request (a Dependabot bump, say) gets it too.
  #
  # Ten minutes is a ceiling: the whole check is under a minute, and most
  # of that is fetching the advisory database.
  deny:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # `[graph] all-features = true` in deny.toml already covers the
          # feature set; this is the action's own default, stated so it
          # cannot drift from the file.
          arguments: --all-features
  bench:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.bench == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    # `benches/` is its own `[workspace]` (see benches/Cargo.toml), excluded
    # from the root workspace on purpose so a bench-only dependency can never
    # end up in a shipped binary's tree. That means the `test` job's `1.88`
    # matrix leg never touches it — nothing else in this file checks
    # `benches/Cargo.toml`'s own `rust-version = "1.88"` floor without this
    # job carrying the same two-toolchain matrix itself.
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.88"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: benches }
      # `--test` runs each benchmark exactly once and asserts nothing: the
      # point on a shared runner is proving the harness still compiles and
      # executes, not collecting a timing (see benches/benches/memory_sample.rs).
      - run: cargo +${{ matrix.toolchain }} bench --manifest-path benches/Cargo.toml -- --test
  privileged:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch') }}
    # The one `#[ignore]`d test that is ignored for want of privilege rather
    # than by design: `real_runner.rs`'s privilege-drop case needs a real uid
    # change and a real supplementary-group clear, which needs root. The other
    # two ignores in the workspace are child halves of cross-process race
    # tests, re-exec'd by their own parents, and must stay ignored.
    #
    # A container, not `sudo` on the runner: the test asserts a root daemon
    # can drop to `nobody` and that std cleared root's supplementary groups
    # on the way, so it has to actually START as root. A throwaway container
    # filesystem is the cheap way to have that.
    runs-on: ubuntu-latest
    # One test, but the container has to build shep-daemon's test tier to get
    # to it.
    timeout-minutes: 20
    container:
      image: rust:1.88
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `--exact` with the one path, not a bare `--ignored`: the other two
      # `#[ignore]`s in the workspace (`barks.rs`'s `bark_race_child`,
      # `shep_toml.rs`'s `config_race_child`) are child halves that assert
      # nothing and are re-exec'd by their own parents. Running them here
      # would add two green lines that mean nothing.
      - run: >
          cargo test -p shep-daemon --test real_runner --locked --all-features
          -- --ignored --exact a_dropped_child_runs_as_the_requested_user

