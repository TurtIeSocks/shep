name: test
# Runs automatically on pushes to main and on pull requests, by Rin's call on
# 2026-08-16.
#
# The repository is public, so these runs are free regardless of job count or
# platform. That was not always true, and docs/specs/deferred.md keeps the
# billing arithmetic (GitHub charges private-repo Actions minutes per
# platform: Linux 1x, Windows 2x, macOS 10x) for the day it might matter
# again.
#
# The weekly `schedule: [{ cron: "0 0 * * SUN" }]` the earlier comment listed
# is deliberately NOT enabled: a full matrix run every week against an
# unchanged tree spends the most expensive part of this file to learn nothing.
# Worth adding if dependency rot against an idle tree becomes a real concern —
# that decision is Rin's, not made here just because the runs are free.
#
# Every job that compiles Rust carries `Swatinem/rust-cache@v2`, placed after
# its `rustup toolchain install` so the cache key picks up the toolchain that
# will actually build. There was no caching here at all until 2026-08-27, so
# all twelve jobs rebuilt the whole dependency tree from scratch on every push,
# and the Windows legs paid for it worst: a run that should take four minutes
# stalled past fifty. `benches/` is its own workspace with its own target dir,
# so that leg names it explicitly; `privileged` installs no toolchain because
# its container ships one.
#
# Cache scope is per-branch, so the first run on a new PR is still cold. The
# win is the second and every push after it, which is the shape of most work
# here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93 --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.93 fmt --all -- --check
      # `--all-features` mirrors the project's own task gate (CLAUDE.md).
      # Without it, everything behind shep-daemon's `test-fakes` feature is
      # unlinted, and clippy's whole value here is that it sees what the
      # local gate sees.
      - run: cargo +1.93 clippy --workspace --all-targets --all-features -- -D warnings
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly doc --workspace --all-features --no-deps
        env: { RUSTDOCFLAGS: "-Dwarnings --cfg docsrs" }
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1
  test:
    strategy:
      fail-fast: false
      matrix:
        # `ubuntu-24.04-arm` is the leg that matters most and the one this
        # matrix went nine phases without: shep-client's handshake-close test
        # was red on linux/arm64 for five phases (platform audit #1) and
        # nothing here would have said so. Billed as a standard Linux runner,
        # not at the macOS/Windows multiplier.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        toolchain: [stable, "1.88"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - uses: Swatinem/rust-cache@v2
      # `--all-features` mirrors the task gate, as in `lint` above.
      - run: 'cargo +${{ matrix.toolchain }} test --workspace --locked --all-features -- --skip ::slow:: --skip two_concurrent_boots'
  minimal-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly generate-lockfile -Z minimal-versions
      - run: 'cargo +stable test --workspace -- --skip ::slow:: --skip two_concurrent_boots'
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: 'cargo test --workspace --locked --target x86_64-unknown-linux-musl -- --skip ::slow:: --skip two_concurrent_boots'
  # CLAUDE.md's phase-gate cross-check
  # (`cargo check --workspace --all-targets --all-features --target
  # x86_64-pc-windows-gnu`) had no workflow behind it, so it only ran when a
  # human remembered -- and it went three phases unrun that way before Phase
  # 10 caught it (docs/specs/deferred.md, "the windows-gnu cross-check went
  # three phases unrun"). It is `cargo check`, deliberately, not
  # `clippy -- -D warnings`: shep-daemon's `boot`/`sys`/`server`/
  # `tokio_runner` are `cfg(unix)`-gated, so the Windows target reports 51
  # dead-code warnings for code that is not dead on any platform shep ships.
  # Silencing them would mean `#[allow(dead_code)]` on live code. The
  # question this job asks is only whether the tree still compiles for a
  # target nobody has implemented yet.
  #
  # Cross-compiled from ubuntu-latest rather than run natively on
  # windows-latest: `ring`'s build script needs a real GNU `cc` for this
  # target regardless of host OS -- MSVC's `cl.exe` cannot produce it -- and
  # `apt-get install mingw-w64` supplies one in seconds, the same shape the
  # `musl` job above already uses for its own cross target. A GNU-target
  # binary cross-compiled on Linux cannot be executed there either way, which
  # is the other reason this stays `check` rather than `test`. The `test`
  # job's own `windows-latest` legs already give the MSVC target full
  # `cargo test` execution on native Windows; this job's only job is the GNU
  # target's compile-time coverage.
  windows-gnu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: cargo check --workspace --all-targets --all-features --locked --target x86_64-pc-windows-gnu
  features:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: 'cargo test -p shep-daemon --locked --no-default-features -- --skip ::slow:: --skip two_concurrent_boots'
      - run: 'cargo test --workspace --locked --all-features -- --skip ::slow:: --skip two_concurrent_boots'
  # Tests that need a quiet machine, run serially in a job of their own.
  #
  # Two groups belong here and neither is a flaky test in the usual sense:
  # both assert something real that a contended runner cannot hold still for.
  # The `::slow::` modules wait on actual FSEvents/inotify delivery and actual
  # elapsed time, so an assertion like "writes inside `delay` land in one
  # batch" is measuring the debouncer against a wall clock that a noisy
  # neighbour can stretch. `two_concurrent_boots_on_a_stale_socket_exactly_one_wins`
  # races two threads for the same $SHEP_HOME and asserts exactly one wins,
  # which depends on the loser looking after the winner has bound.
  #
  # Every other job skips both groups so the matrix stays fast and honest.
  # This job runs them with `--test-threads=1` so the only load is their own.
  # They are NOT `#[ignore]`d: the tier's own doc says it exists so the full
  # suite covers the real backend, and this project has already found a Linux
  # branch that went five phases without a compiler reading it.
  #
  # One leg per watcher backend -- FSEvents, inotify, ReadDirectoryChangesW --
  # since the backend is the thing under test. No second Linux leg: the arm
  # runner would exercise the same inotify. Stable only, for the same reason;
  # the compiler is not what varies here. `--workspace`, matching the skip the
  # other jobs apply, so a `mod slow` added outside shep-daemon later cannot
  # end up skipped everywhere and run nowhere.
  #
  # libtest takes both filters positionally, so this is one command. On
  # Windows the boot half matches nothing, because `boot.rs`'s tests are
  # `cfg(unix)` -- that is the platform split, not a filter typo.
  slow:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: 'cargo test --workspace --locked --all-features -- --test-threads=1 ::slow:: two_concurrent_boots'
  # `cargo llvm-cov` on its own runs `cargo test --tests`, and `--tests` does
  # not build a package's examples. `daemon_e2e`'s two reload tests exec
  # `examples/reuse_port_sheep`, the SO_REUSEPORT fixture the whole reload
  # measurement rests on, and fail without it. `--all-targets` does not help:
  # it compiles examples in test mode into `deps/` rather than uplifting a
  # plain binary into `examples/`, which is the path the test looks in.
  #
  # So this drives llvm-cov by hand instead. `show-env` exports the wrapper and
  # profile settings, an ordinary `cargo test` builds examples the same way
  # every other job does, and `report` reads the profile data afterwards.
  #
  # The bug is older than the `slow` split above and was hidden by it: cargo
  # stops at the first failing test binary, and the lib tier used to fail
  # first, so this job never reached `daemon_e2e`.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component llvm-tools
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: |
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace
          cargo test --workspace --locked -- --skip ::slow:: --skip two_concurrent_boots
          cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: lcov.info }
  bench:
    # `benches/` is its own `[workspace]` (see benches/Cargo.toml), excluded
    # from the root workspace on purpose so a bench-only dependency can never
    # end up in a shipped binary's tree. That means the `test` job's `1.88`
    # matrix leg never touches it — nothing else in this file checks
    # `benches/Cargo.toml`'s own `rust-version = "1.88"` floor without this
    # job carrying the same two-toolchain matrix itself.
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.88"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: benches }
      # `--test` runs each benchmark exactly once and asserts nothing: the
      # point on a shared runner is proving the harness still compiles and
      # executes, not collecting a timing (see benches/benches/memory_sample.rs).
      - run: cargo +${{ matrix.toolchain }} bench --manifest-path benches/Cargo.toml -- --test
  privileged:
    # The one `#[ignore]`d test that is ignored for want of privilege rather
    # than by design: `real_runner.rs`'s privilege-drop case needs a real uid
    # change and a real supplementary-group clear, which needs root. The other
    # two ignores in the workspace are child halves of cross-process race
    # tests, re-exec'd by their own parents, and must stay ignored.
    #
    # A container, not `sudo` on the runner: the test asserts a root daemon
    # can drop to `nobody` and that std cleared root's supplementary groups
    # on the way, so it has to actually START as root. A throwaway container
    # filesystem is the cheap way to have that.
    runs-on: ubuntu-latest
    container:
      image: rust:1.88
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # `--exact` with the one path, not a bare `--ignored`: the other two
      # `#[ignore]`s in the workspace (`barks.rs`'s `bark_race_child`,
      # `shep_toml.rs`'s `config_race_child`) are child halves that assert
      # nothing and are re-exec'd by their own parents. Running them here
      # would add two green lines that mean nothing.
      - run: >
          cargo test -p shep-daemon --test real_runner --locked --all-features
          -- --ignored --exact a_dropped_child_runs_as_the_requested_user
