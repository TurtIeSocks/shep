name: Release
# Tags the commit, creates the GitHub release, and uploads to crates.io.
# Runs on every push to main; does nothing unless a manifest names a version
# not on crates.io, so merging the release PR is what actually publishes.
#
# No test gate here: main's ruleset already requires lint, docs, typos, the
# test matrix, features, musl and minimal-versions, so an untested commit
# cannot reach main; removing it without restoring a gate here would
# publish whatever lands.

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-plz-release
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # An environment: lets a required reviewer be added later as a human
    # gate before a version is spent. Inert until one is configured.
    environment: crates-io
    # A ceiling against a hang, not a budget: runs take well under two
    # minutes. Matters more here than in most jobs, since this one holds a
    # write-capable token against GitHub's 360-minute default.
    timeout-minutes: 30
    steps:
      # Every action here is pinned by commit, not by tag: this job holds
      # RELEASE_PLZ_TOKEN and CARGO_REGISTRY_TOKEN, a bigger risk for a
      # mutable tag than in a job that only runs tests.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # release-plz needs the history to know what is already released.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          # Write-capable token: without this it lands in .git/config,
          # readable by every later step. release-plz pushes over the API.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Pinning by SHA replaces the ref this action reads its default
          # toolchain from, so it fails without an explicit `toolchain:` here.
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Pinned by commit: this action holds contents:write and
      # CARGO_REGISTRY_TOKEN. release-plz resolves publish order across the
      # five crates from the dependency graph.
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
