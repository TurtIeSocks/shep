name: nextest report
description: >-
  Reads the junit nextest wrote for one profile, annotates every test that
  passed only on retry, and keeps the file as an artifact.
# Why a composite action rather than two steps pasted into six jobs: the
# steps are identical everywhere except the profile and the artifact name,
# and a fix to how a retry is reported should land in one place.
#
# Retries are configured in .config/nextest.toml for the integration tier
# only. A test that failed and then passed is a green job with a defect in
# it, and nothing in nextest's own output makes that hard to miss on a run
# nobody is watching. This turns each one into a warning annotation on the
# run and a row in the job summary, so a retried test is something a person
# reads rather than something a retry absorbed. The note above `retries` in
# .config/nextest.toml says what a retry does and does not excuse.
#
# `shell: python` rather than `bash` calling `python3`: every hosted runner
# puts a `python` on PATH, while `python3` on windows-latest depends on
# which shim wins, and this has to run on all three.
inputs:
  profile:
    description: The nextest profile whose junit to read.
    default: ci
  name:
    description: The artifact name; unique per job and per matrix leg.
    required: true
runs:
  using: composite
  steps:
    - shell: python
      env:
        JUNIT: target/nextest/${{ inputs.profile }}/junit.xml
      run: |
        # nextest marks a test that failed and then passed with a
        # <flakyFailure> or <flakyError> child, and one that failed every
        # retry with <rerunFailure> / <rerunError> beside its <failure>. The
        # second kind already failed the job. The first is the one this is
        # for: a green run carrying a defect. Always exits 0; the test step
        # already gave the verdict, this is the report.
        import os
        import sys
        import xml.etree.ElementTree as ET

        path = os.environ["JUNIT"]
        if not os.path.exists(path):
            print(f"::notice::no junit at {path}; nothing to report")
            sys.exit(0)
        try:
            root = ET.parse(path).getroot()
        except ET.ParseError as error:
            print(f"::warning::could not parse {path}: {error}")
            sys.exit(0)

        retried = []
        exhausted = []
        for case in root.iter("testcase"):
            name = f"{case.get('classname', '?')}::{case.get('name', '?')}"
            failed_first = sum(
                1 for tag in ("flakyFailure", "flakyError") for _ in case.iter(tag)
            )
            if failed_first:
                retried.append((name, failed_first))
            if any(True for tag in ("rerunFailure", "rerunError") for _ in case.iter(tag)):
                exhausted.append(name)

        for name, count in retried:
            times = "once" if count == 1 else f"{count} times"
            print(
                f"::warning title=Passed only on retry::{name} failed {times} "
                "before passing. Read the failure before shrugging at it: a "
                "retry hides a defect as readily as a flake."
            )

        summary = os.environ.get("GITHUB_STEP_SUMMARY")
        if summary and (retried or exhausted):
            with open(summary, "a", encoding="utf-8") as out:
                out.write("### Retried tests\n\n")
                if retried:
                    out.write("| Passed only on retry | Failed first |\n|---|---|\n")
                    for name, count in retried:
                        out.write(f"| `{name}` | {count} |\n")
                    out.write("\n")
                if exhausted:
                    out.write("Failed on every retry:\n\n")
                    for name in exhausted:
                        out.write(f"- `{name}`\n")
                    out.write("\n")
        if not retried and not exhausted:
            print(f"no retried tests in {path}")
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.name }}
        path: target/nextest/${{ inputs.profile }}/junit.xml
        if-no-files-found: ignore
        retention-days: 14
