[package]
name = "shep-benches"
version = "0.1.0"
publish = false
# Spelled literally, not inherited: the `[workspace]` table below makes this
# crate its own workspace root, so `edition.workspace = true` would resolve
# against this file's absent `[workspace.package]` and fail to parse. Keep
# in step with the root Cargo.toml by hand.
edition = "2024"
rust-version = "1.88"

# Own workspace table: this crate is excluded from the root workspace's
# dependency unification so a bench-only dependency can never end up in a
# shipped binary's tree.
[workspace]

[dependencies]
shep-daemon = { path = "../crates/shep-daemon" }
# rust-version 1.80, under this workspace's 1.88 floor. Turning off defaults
# (rayon, plotters, cargo_bench_support) and naming cargo_bench_support back
# on keeps rayon and plotters out of a bench crate that only runs via
# `cargo bench`.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "memory_sample"
harness = false

# No `[lints]` here: `workspace = true` fails for the same reason
# `edition.workspace = true` does above. Restating the root's deny list by
# hand would police an unpublished, unshipped bench crate whose only reader
# runs `cargo bench`.
