[workspace]
resolver = "3"
members = [
    "crates/shep-core",
    "crates/shep-daemon",
    "crates/shep-client",
    "crates/shep-macros",
    "crates/shep-cli",
    "crates/shep-cli-redirect",
    # Runnable demos of shep's supervision behaviors (probes, restarts, memory
    # limits, graceful stop, logs). Not published: publish = false, and
    # release-plz.toml marks it release = false too.
    "examples",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
# 1.88: serde-saphyr's let-chains need it; also the floor ratatui, sysinfo
# and rmcp require.
rust-version = "1.88"
repository = "https://github.com/shep-pm/shep"
# Clean-room: pm2 is feature-list inspiration only, no shared code.
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# cargo publish strips `path`, so these need a literal version even though
# every consumer here resolves by path. Not sourced from
# workspace.package.version above; a release bump touches both by hand.
shep-core = { path = "crates/shep-core", version = "0.3.0" }
shep-daemon = { path = "crates/shep-daemon", version = "0.3.0" }
shep-client = { path = "crates/shep-client", version = "0.3.0" }
shep-macros = { path = "crates/shep-macros", version = "0.3.0" }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
# The read-modify-write behind `shep.toml` and `dogs.toml`: `shep-cli`'s
# `ShepToml` and `shep-daemon`'s `dogs::set_dog_section` both edit the
# document they parsed rather than rendering a map back out, so a comment or
# a key order an operator chose survives. Adds zero crates: `toml` 0.8 above
# already pulls `toml_edit` in as its own backing implementation.
#
# Floor 0.22.7: `DocumentMut` is that release's rename of the older `Document`.
toml_edit = { version = "0.22.7", default-features = false, features = ["display", "parse"] }
serde-saphyr = { version = "1", default-features = false, features = ["deserialize"] }
# Transitive floor pins: -Z minimal-versions picks a version below what a
# dependency's own code actually needs.
#   - annotate-snippets: Title::element() needed, added 0.12.3.
#   - anstyle (via annotate-snippets): impl Display for Style needed, added 1.0.5.
#   - encoding_rs_io (via serde-saphyr): DecodeReaderBytesBuilder::bom_override() needed, added 0.1.2.
#   - pest (via json5's error.rs): error::LineColLocation/Error::line_col needed, added 2.0.2.
#   - quote (via json5's pest_derive bootstrap dep): Tokens::append/as_ref needed, added 0.3.15.
#   - syn (via tokio-util's tracing-attributes): LitInt::base10_parse needed, added 1.0.1.
annotate-snippets = { version = "0.12.3", default-features = false }
anstyle = { version = "1.0.5", default-features = false }
encoding_rs_io = { version = "0.1.2", default-features = false }
pest = { version = "2.0.2", default-features = false }
# Renamed: shep-macros needs the current syn/quote, and a workspace
# dependency key can only be spelled once, so the floor pins above take
# these names instead.
quote-floor = { package = "quote", version = "0.3.15", default-features = false }
syn-floor = { package = "syn", version = "1.0.1", default-features = false }
# Current syn/quote plus proc-macro2, for shep-macros. `proc-macro` turns a
# proc_macro2::TokenStream into the proc_macro::TokenStream a derive must
# return.
proc-macro2 = { version = "1.0", default-features = false, features = ["proc-macro"] }
quote = { version = "1.0", default-features = false, features = ["proc-macro"] }
syn = { version = "2.0", default-features = false }
json5 = { version = "0.4", default-features = false }
# Floor 1.9: regex 1.8's compiled-size accounting lets
# `selector_spec_oversized_regex_is_rejected`'s huge pattern slip under the
# 1 MiB size_limit; 1.9 rejects it.
regex = { version = "1.9", default-features = false, features = ["std", "unicode-perl"] }
# Floor 0.4.11: `watch/mod.rs`'s `own_log_ignores` calls `globset::escape`,
# added in 0.4.11.
globset = { version = "0.4.11", default-features = false }
# Floor 1.41: tokio_runner.rs needs Command::as_std_mut (1.39.1) and
# Command::process_group without its tokio_unstable gate (1.40.0); extras.rs's
# tests need JoinHandle::id/AbortHandle::id, stable only from 1.41.0.
tokio = { version = "1.41", default-features = false }
# Floor 0.7.9: rmcp's transport::async_rw imports tokio_util::bytes, a
# `pub use bytes;` re-export not carried before 0.7.9.
tokio-util = { version = "0.7.9", default-features = false, features = ["codec"] }
bytes = { version = "1", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Only shep-daemon: process-group signal delivery and process-related syscalls for the
# real ProcessRunner (kill ladder, SIGKILL tree); `user` adds geteuid for the same-uid
# peer-cred check and passwd/group lookups for `user`/`group` spawn.
nix = { version = "0.29", default-features = false, features = ["signal", "process", "user"] }
# Only shep-daemon: passes the shepherd-channel socketpair as fd 3 into the spawned child.
command-fds = { version = "0.3", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
# Floor 0.1.28: tracing under-declares tracing-core; supervisor.rs's
# bare-field `tracing::debug!(id, name, value, ...)` shorthand needs
# impl Value for String.
tracing-core = { version = "0.1.28", default-features = false }
# env-filter and json feature the daemon's diagnostics; tracing-log bridge
# dropped since nothing here uses `log`.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "ansi", "env-filter", "json"] }
# Floor 1.0.2: sharded-slab (tracing-subscriber's span registry) imports
# `lazy_static!` by path, which needs it exported
# `#[macro_export(local_inner_macros)]`; absent before 1.0.2.
lazy_static = { version = "1.0.2", default-features = false }
# Floor 1.18.1: shep-core's insta::assert_json_snapshot! calls snapshot
# newtype/tuple enum variants; 1.18.0 has a JSON-serialization regression there.
insta = { version = "1.18.1", default-features = false, features = ["json"] }
# Floor 3.10: shep-core's `barks::write_ring` uses `Builder::permissions` to
# create the ring at 0600 directly, added in tempfile 3.10.0.
tempfile = { version = "3.10", default-features = false }
# Only shep-daemon (dev): property tests on the kill ladder / supervisor state machine.
proptest = { version = "1", default-features = false, features = ["std"] }
# Floor 0.1.3: `broadcast::Receiver` has no poll API for the event-bus
# subscription stream; `wrappers::BroadcastStream` needs the `sync` feature,
# absent before 0.1.3.
tokio-stream = { version = "0.1.3", default-features = false, features = ["sync"] }
# Windows only, shep-daemon only: the job-object API standing in for a unix
# process group (sys_windows.rs). Already in the lock via tokio/mio, so this
# adds an edge, not a crate. `Win32_System_Threading` is GetCurrentProcess
# for the job-environment report. `Win32_System_SystemInformation` is
# OSVERSIONINFOW and `Wdk_System_SystemServices` is RtlGetVersion, the
# unshimmed build number: GetVersionExW reports 6.2 to an unmanifested binary.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Threading", "Win32_System_SystemInformation", "Wdk_System_SystemServices"] }
# Windows only, shep-daemon only: the unguessable half of a shepherd-channel
# pipe name (tokio_runner.rs). The pipe's default security descriptor grants
# every local account read access and the single accept authenticates
# nobody, so the name itself keeps a hostile local account from pre-opening
# it. Already in the lock via tempfile, so this adds an edge, not a crate.
getrandom = { version = "0.4", default-features = false }
# shep-cli's dev-dependencies, for `crates/shep-cli/tests/cli_e2e.rs`.
# `default-features = false` already matches assert_cmd's real default
# (neither `color` nor `color-auto` is on by default); for predicates it
# drops the upstream default set (`color`, `diff`, `float-cmp`,
# `normalize-line-endings`, `regex`) to nothing.
assert_cmd = { version = "2", default-features = false }
predicates = { version = "3", default-features = false }
# The cron_restart dialect (spec §4). `serde` is croner's only feature; we do
# not serialize a parsed Cron, the Flockfile carries the pattern string.
croner = { version = "3.0.1", default-features = false }
# croner is generic over chrono::TimeZone; `clock` provides Utc::now(), which
# the daemon's cron worker reads to derive the next occurrence.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Resolves cron_timezone's IANA name to a chrono::TimeZone. croner carries this
# only as a dev-dependency, so it is ours to declare.
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
# Process-table RSS sampling for the polling memory-limit enforcer. Held at
# 0.38: sysinfo 0.39.0+ declares rust-version = "1.95", above this
# workspace's 1.88 MSRV. Defaults bring component/disk/network/user, none of
# which the daemon reads; `multithread` pulls in rayon, against the
# idle-footprint goal (spec §14.11), and is not enabled.
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
# Filesystem events for watch-restart (spec §4). notify picks its own backend
# per platform except on macOS, where `macos_fsevent` is a default feature:
# dropping defaults without naming it again falls back to the polling
# watcher, and watch latency on macOS silently becomes seconds.
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
# Coalesces the burst a single editor save produces into one batch. On macOS
# and Windows it additionally stitches renames through a file-id cache; on
# Linux `RecommendedCache` is `NoCache` and inotify's own rename cookies do
# that job.
notify-debouncer-full = { version = "0.7.0", default-features = false }
# Floor 4.1.0: notify 8.2.0 declares fsevent-sys "4.0.0", but its fsevent.rs
# needs FSEventsGetCurrentEventId, FSEventStreamGetDeviceBeingWatched and
# FSEventsPurgeEventsForDeviceUpToEventId, all added in 4.1.0. macOS only,
# but unconditional since Cargo resolves one version workspace-wide.
fsevent-sys = "4.1.0"
# Bark's sinks are Discord and Slack webhooks (HTTPS), the one thing here
# needing TLS. tokio-rustls + webpki-roots, not reqwest: reqwest's default
# rustls pulls in aws-lc-sys, needing both a C compiler and cmake; this
# pulls fewer crates and needs only a C compiler. `ring`, not the default
# `aws_lc_rs`, is the crypto provider.
#
# ring's build.rs uses `cc` to compile C and assembly for the target: a
# cross-compile needs a C compiler for that target, so
# `--target x86_64-pc-windows-gnu` from macOS needs mingw-w64 installed.
# Native builds (macOS clang, CI's musl-tools, Windows MSVC) are unaffected.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Mozilla's compiled-in root store. rustls itself is reached through
# tokio-rustls's `pub use rustls;`; not named directly in
# crates/shep-cli/Cargo.toml since only the re-exported types are needed.
webpki-roots = "0.26"
# The lookout TUI (spec §9): cell diffing, resize handling and cursor
# arithmetic are the whole cost of a terminal UI, already solved by an
# established crate.
#
# `crossterm_0_29` pins the backend's crossterm line to match the direct
# dependency below; `layout-cache` is the memoized layout solver;
# `underline-color` lets a coloured underline skip a second style pass. Not
# `all-widgets` or `macros` (ratatui-macros is sugar). The calendar widget
# ships anyway: `ratatui-widgets`' own default list turns its `calendar`
# feature on regardless of what is requested here (see the `time` pin below).
ratatui = { version = "0.30", default-features = false, features = ["std", "crossterm_0_29", "layout-cache", "underline-color"] }
# Named directly, not reached through ratatui's re-export: a feature can
# only be enabled by a crate that names the dependency, and
# `crossterm::event::EventStream` needs `event-stream`. `events` is the
# key/resize types. Not `windows`: this sits under
# `[target.'cfg(unix)'.dependencies]` in shep-cli, since lookout is
# `#[cfg(unix)]`.
crossterm = { version = "0.29", default-features = false, features = ["events", "event-stream"] }
# Floor 0.3.37: not used directly, pinned only to force the resolved floor.
# ratatui-widgets' calendar.rs needs Date::replace_day (0.3.9) and
# Month::length (0.3.37), the later of the two.
time = { version = "0.3.37", default-features = false }
# Floor 0.3.4: not used directly, same reasoning as the `time` pin above.
# ratatui's widgets.rs applies `#[instability::unstable(...)]` to a braced
# `pub use { A, B };` re-export, a shape the macro can't handle before 0.3.4.
instability = { version = "0.3.4", default-features = false }
# The MCP SDK, for `shep whistle` (spec §8, §9): MCP is an evolving
# protocol, and tracking an SDK beats owning a parser for a wire format
# still moving.
#
# Version 3.1.2, not "3": -Z minimal-versions resolves a bare "3" to 3.0.0,
# an API nobody here has compiled.
rmcp = { version = "3.1.2", default-features = false, features = ["server", "macros", "transport-io"] }
# Generates each whistle tool's input/output schema. Costs no extra crate:
# rmcp's `server` feature already requires it. Declared directly because
# `#[derive(JsonSchema)]` emits absolute `schemars::` paths, and rmcp only
# re-exports the crate.
#
# Pinned exactly: rmcp declares `schemars = "1.0"` with `chrono04`; 1.2.2
# satisfies it and keeps exactly one schemars package in the lockfile, since
# two schemars majors would mean two `JsonSchema` traits. `derive` and `std`
# are schemars' own defaults, named because a crate that uses a feature says so.
schemars = { version = "1.2.2", default-features = false, features = ["derive", "std"] }

# Debuginfo in `target/` is mostly dependencies: default `debug = true`
# emits full DWARF for every crate and links a copy into each test binary.
# Line tables keep the backtraces a panicking test prints; dependencies need
# none, since we never step through them.
#
# Does not shrink a `target/` that has grown across feature combos and extra
# target dirs; that needs `cargo clean`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Cargo's default release profile optimizes each crate on its own, but the
# daemon's hot paths cross crate boundaries on every log line: the pump is in
# shep-daemon, the codec and `BusEvent` in shep-core, the channels and timer
# wheel in tokio. `lto = "thin"`: a quarter smaller binary, and this
# workload is bound by syscalls and wakeups rather than inlinable code, so
# thin and fat LTO run the same speed.
#
# Not `panic = "abort"`: shep-client's spawn.rs calls `JoinError::is_panic`
# and `resume_unwind` to re-raise a panicked task in its caller, which needs
# a runtime that unwinds.
#
# Not `strip`: symbols are what let `sample(1)` name a frame during profiling.
[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# Every pub `Result`-returning item needs a `# Errors` section.
missing_errors_doc = "deny"
