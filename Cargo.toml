[workspace]
resolver = "3"
members = [
    "crates/shep-core",
    "crates/shep-daemon",
    "crates/shep-client",
    "crates/shep-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/rin/pm2-rs"
# Clean-room implementation — pm2 is feature-list inspiration only (Rin, 2026-08-07).
license = "MIT OR Apache-2.0"

[workspace.dependencies]
shep-core = { path = "crates/shep-core" }
shep-daemon = { path = "crates/shep-daemon" }
shep-client = { path = "crates/shep-client" }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
serde-saphyr = { version = "1", default-features = false, features = ["deserialize"] }
json5 = { version = "0.4", default-features = false }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
globset = { version = "0.4", default-features = false }
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
bytes = { version = "1", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
insta = { version = "1", default-features = false, features = ["json"] }
tempfile = { version = "3", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
