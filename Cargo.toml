[workspace]
resolver = "3"
members = [
    "crates/shep-core",
    "crates/shep-daemon",
    "crates/shep-client",
    "crates/shep-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.88 forced by serde-saphyr (let-chains, stabilized 1.88) — a current dep,
# not a future one. Also the floor for ratatui/sysinfo/rmcp in later phases.
rust-version = "1.88"
repository = "https://github.com/TurtIeSocks/shep"
# Clean-room implementation — pm2 is feature-list inspiration only (Rin, 2026-08-07).
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# `cargo publish` strips `path` from a dependency and needs a version to put
# in its place, so these three need one even though every consumer in this
# workspace resolves them by path. There is no `version.workspace = true`
# form inside a dependency entry — Cargo only supports that shorthand for
# the `[package]` table — so this literal is not sourced from
# `workspace.package.version` above and a release bump has to touch both
# places by hand. If that drifts, `cargo-release` is the mechanical fix.
shep-core = { path = "crates/shep-core", version = "0.1.0" }
shep-daemon = { path = "crates/shep-daemon", version = "0.1.0" }
shep-client = { path = "crates/shep-client", version = "0.1.0" }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
serde-saphyr = { version = "1", default-features = false, features = ["deserialize"] }
# Transitive floor pins (referenced from shep-core, which depends on serde-saphyr and
# json5) forcing -Z minimal-versions past bugs where a transitive dep under-declares its
# own true minimum:
#   - annotate-snippets 0.12.0/0.12.1/0.12.2 lack `Title::element()`, added in 0.12.3.
#   - annotate-snippets itself under-declares anstyle as "1.0.4"; it actually needs
#     `impl Display for Style`, added in anstyle 1.0.5.
#   - encoding_rs_io 0.1.0/0.1.1 lack `DecodeReaderBytesBuilder::bom_override()`, added
#     in 0.1.2. Both are pulled in by serde-saphyr's `deserialize` feature.
#   - pest 2.0.0/2.0.1 lack `error::LineColLocation` and `Error::line_col`, which
#     json5 0.4.0's error.rs uses despite json5 only declaring pest = "2.0"; present
#     from pest 2.0.2.
#   - json5's pest_derive 1.0.2 (pulled in by pest_meta as a bootstrap dependency,
#     unrelated to the pest 2.x line above) under-declares quote as "^0.3" (floor
#     0.3.0), but its generated code needs `Tokens::append(impl ToString)` and
#     `Tokens::as_ref()`, added in quote 0.3.15.
#   - tokio-util's `tracing` dependency chain pulls in tracing-attributes, which
#     under-declares syn as "1" (floor 1.0.0) but needs `LitInt::base10_parse`,
#     added in syn 1.0.1.
annotate-snippets = { version = "0.12.3", default-features = false }
anstyle = { version = "1.0.5", default-features = false }
encoding_rs_io = { version = "0.1.2", default-features = false }
pest = { version = "2.0.2", default-features = false }
quote = { version = "0.3.15", default-features = false }
syn = { version = "1.0.1", default-features = false }
json5 = { version = "0.4", default-features = false }
# regex 1.8.0's compiled-size accounting lets `selector_spec_oversized_regex_is_rejected`'s
# huge pattern slip under the 1 MiB `size_limit`; 1.9+ rejects it. Floor to 1.9 so the
# selector-bridge test holds under `-Z minimal-versions`.
regex = { version = "1.9", default-features = false, features = ["std", "unicode-perl"] }
# Floor 0.4.11: `watch/mod.rs`'s `own_log_ignores` builds an ignore glob out of a real
# path and calls `globset::escape` to neutralize the metacharacters a tempdir or a user's
# directory name can contain. That function does not exist before 0.4.11 — `-Z
# minimal-versions` picks 0.4.0 without this and fails with `cannot find function escape
# in crate globset`.
globset = { version = "0.4.11", default-features = false }
# `tokio::task::JoinHandle::is_finished` (shep-daemon's fake.rs cancel-safety test uses
# it to assert a `wait()` future is genuinely still pending before dropping it) landed in
# tokio 1.19.0, but shep-daemon's tokio_runner.rs (the real `ProcessRunner`, already
# landed in Phase 2a but never rehearsed against `-Z minimal-versions` with the `process`
# feature before Task 2's bus rehearsal caught it) needs two later APIs:
# `Command::as_std_mut` (added 1.39.1 — 1.39.0 was yanked) and `Command::process_group`
# losing its `#[cfg(tokio_unstable)]` gate (1.40.0). Floor to 1.40 — the lowest we've
# empirically confirmed builds and passes the workspace under `-Z minimal-versions`.
tokio = { version = "1.40", default-features = false }
# 0.7.0 has a broken minimum floor: it needs a newer tokio (mpsc `reserve_owned`, absent
# from tokio 1.0.1) and a working log/tracing bridge (`trace!` fails to resolve under
# minimal deps). Fixed in 0.7.1, which also pulls in a tokio floor high enough to compile.
tokio-util = { version = "0.7.1", default-features = false, features = ["codec"] }
bytes = { version = "1", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Only shep-daemon: process-group signal delivery and process-related syscalls for the
# real ProcessRunner (kill ladder, SIGKILL tree); `user` adds geteuid for the same-uid
# peer-cred check and passwd/group lookups for `user`/`group` spawn.
nix = { version = "0.29", default-features = false, features = ["signal", "process", "user"] }
# Only shep-daemon: passes the shepherd-channel socketpair as fd 3 into the spawned child.
command-fds = { version = "0.3", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
# Transitive floor pin: `tracing`'s own Cargo.toml under-declares its `tracing-core`
# requirement down to versions lacking `impl Value for String`, which shep-daemon's
# supervisor.rs needs for the bare-field `tracing::debug!(id, name, value, ...)` shorthand
# (a Phase 2a call site, also caught by Task 2's minimal-versions rehearsal). Missing in
# 0.1.26/0.1.27; present from 0.1.28.
tracing-core = { version = "0.1.28", default-features = false }
# Option: the daemon's own diagnostics. `env-filter` costs exactly one crate
# (matchers) and `json` exactly one (tracing-serde); the rest of the tree is
# already present via regex/globset/serde. The default `tracing-log` bridge is
# dropped because nothing here uses the `log` crate.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "ansi", "env-filter", "json"] }
# Transitive floor pin: `sharded-slab` (tracing-subscriber's span registry) imports
# `lazy_static!` by path — `use lazy_static::lazy_static;` — while declaring only
# `lazy_static = "1"`. That expansion names `__lazy_static_internal`, which a path import
# can only resolve once the macro is exported `#[macro_export(local_inner_macros)]`. 1.0.0
# and 1.0.1 export it plainly and fail with `cannot find macro __lazy_static_internal in
# this scope`; present from 1.0.2.
lazy_static = { version = "1.0.2", default-features = false }
# Our `insta::assert_json_snapshot!` calls in shep-core (protocol::request,
# protocol::events) snapshot newtype/tuple enum variants (the Result-shaped reply
# payload); 1.18.0 has a JSON-serialization regression with exactly that shape, fixed
# in 1.18.1.
insta = { version = "1.18.1", default-features = false, features = ["json"] }
# Floor 3.9: shep-core's `barks::write_ring` stages the ring through
# `Builder::permissions`, so the temp file is created at 0600 in the `open` call
# rather than chmod'ed afterwards. That builder method landed in tempfile 3.9.0 —
# `-Z minimal-versions` picks 3.0.0 without this and fails with `no method named
# permissions found for struct Builder`.
tempfile = { version = "3.9", default-features = false }
# Only shep-daemon (dev): property tests on the kill ladder / supervisor state machine.
proptest = { version = "1", default-features = false, features = ["std"] }
# For the event-bus subscription stream: `broadcast::Receiver` has no poll
# API, so a hand-rolled `Stream::poll_next` over it either does not compile
# or busy-spins on `try_recv` (which registers no waker).
# `wrappers::BroadcastStream` is the upstream answer, gated behind the `sync`
# feature, which does not exist before 0.1.3 — verified against the
# crates.io index, where 0.1.0-0.1.2 declare only
# `default`/`fs`/`io-util`/`net`/`time`. `BroadcastStreamRecvError` is
# defined at tokio-stream-0.1.3/src/wrappers/broadcast.rs:22, so 0.1.3 is
# the correct floor.
tokio-stream = { version = "0.1.3", default-features = false, features = ["sync"] }
# `shep-cli`'s dev-dependencies, for Task 12's real-binary e2e tier
# (`crates/shep-cli/tests/cli_e2e.rs`). Neither crate has any call site yet —
# this phase's other tasks land the assertions that actually exercise them —
# so no feature beyond the bare crate is named; the task that writes the
# first assertion adds whatever feature it needs (`regex`, `diff`, ...) with
# its own comment. `default-features = false` already matches assert_cmd's
# real default (neither of its two features, `color`/`color-auto`, is on by
# default); for predicates it drops the upstream default set (`color`,
# `diff`, `float-cmp`, `normalize-line-endings`, `regex`) down to nothing.
assert_cmd = { version = "2", default-features = false }
predicates = { version = "3", default-features = false }
# The cron_restart dialect (spec §4). `serde` is croner's only feature and we
# do not serialize a parsed Cron — the Flockfile carries the pattern string.
croner = { version = "3.0.1", default-features = false }
# croner is generic over chrono::TimeZone; `clock` is what provides Utc::now(),
# which the daemon's cron worker reads to derive the next occurrence.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Resolves cron_timezone's IANA name to a chrono::TimeZone. croner carries this
# only as a dev-dependency, so it is ours to declare.
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
# Process-table RSS sampling for the polling memory-limit enforcer. Held at the
# 0.38 line: sysinfo 0.39.0+ declares rust-version = "1.95" and this workspace's
# MSRV is 1.88 (Cargo.toml:14, and the 1.88 leg of the CI test matrix). 0.38.4
# carries the identical API this crate uses — refresh_processes_specifics,
# ProcessRefreshKind::nothing/with_memory, Process::memory/parent, Pid::as_u32.
# Defaults bring component/disk/network/user, none of which the daemon reads;
# the `multithread` feature pulls rayon into a daemon whose idle-footprint goal
# is single-digit MB (spec §14.11) and is not enabled.
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
# Filesystem events for watch-restart (spec §4). notify picks its own backend
# per platform — inotify, ReadDirectoryChangesW — except on macOS, where
# `macos_fsevent` is a DEFAULT feature: dropping default features without
# naming it again falls back to the polling watcher, and watch latency on
# macOS silently becomes seconds.
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
# Coalesces the burst a single editor save produces into one batch. On macOS
# and Windows it additionally stitches renames through a file-id cache; on
# Linux `RecommendedCache` is `NoCache` and inotify's own rename cookies do
# that job.
notify-debouncer-full = { version = "0.7.0", default-features = false }
# Transitive floor pin: notify 8.2.0 declares fsevent-sys "4.0.0", but its
# fsevent.rs needs `FSEventsGetCurrentEventId`,
# `FSEventStreamGetDeviceBeingWatched` and
# `FSEventsPurgeEventsForDeviceUpToEventId`, all added in 4.1.0. macOS only,
# but the pin is unconditional because that is where the rehearsal runs.
fsevent-sys = "4.1.0"
# Bark's sinks are Discord and Slack webhooks, which are HTTPS, so this is
# the one thing in the workspace that needs TLS. Rin's ruling (2026-08-12)
# is a hand-rolled HTTP/1.1 client over tokio-rustls rather than reqwest:
# reqwest's default rustls feature costs +93 crates over this workspace's
# existing 196 and pulls aws-lc-sys, which needs BOTH a C compiler and cmake;
# tokio-rustls + webpki-roots, named directly, costs +10 crates and needs a C
# compiler but no cmake. `ring`, not the default `aws_lc_rs`, is the crypto
# provider, and tokio-rustls's own default features pull aws_lc_rs in unless
# named away.
#
# What this DOES cost, stated plainly because an earlier version of this
# comment claimed the opposite: ring's build.rs uses `cc` to compile C and
# assembly for the target, so building shep-cli for a target needs a C
# compiler for THAT target. Native builds are unaffected — macOS ships clang,
# the CI musl job installs musl-tools, and GitHub's windows-latest runners
# ship the MSVC build tools ring wants for windows-msvc. A CROSS-compile is
# where it is felt: `--target x86_64-pc-windows-gnu` from macOS needs
# mingw-w64 installed. Measured 2026-08-13 with it installed, the whole
# workspace cross-compiles clean —
#   cargo check --workspace --all-targets --all-features \
#     --target x86_64-pc-windows-gnu     # EXIT=0, 8.42s
# — and that check is back in CLAUDE.md's gate section after three phases
# out. shep-daemon has no ring in its tree, so the Linux cross-check beside
# it needs no cross C toolchain and is scoped to `-p shep-daemon` for exactly
# that reason.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Mozilla's compiled-in root store. rustls itself is reached through
# tokio-rustls's own `pub use rustls;` (tokio-rustls-0.26.4/src/lib.rs) — a
# direct `rustls` dependency is not named in crates/shep-cli/Cargo.toml
# because nothing there needs to name the crate, only the types it
# re-exports.
webpki-roots = "0.26"
# The lookout TUI (spec §9). A terminal UI is the one thing in this tree that
# is genuinely not worth hand-rolling — the cell diffing, the resize handling
# and the cursor arithmetic are the whole cost, and all three are exactly what
# an established TUI crate has already got right. Same argument that took
# `rmcp` for whistle, and the opposite of the one that rejected reqwest: this
# is a rendering library with no protocol, no TLS and no C toolchain behind it.
#
# Features per IR-2. `crossterm_0_29` pins the backend's crossterm line
# explicitly so it can never skew from our own direct dependency below;
# `layout-cache` is the memoized layout solver; `underline-color` is what makes
# a coloured underline expressible without a second style pass. Not
# `all-widgets` (gates the calendar widget alone, unused) and not `macros`
# (ratatui-macros is sugar; KISS).
ratatui = { version = "0.30", default-features = false, features = ["std", "crossterm_0_29", "layout-cache", "underline-color"] }
# The backend, named directly rather than reached through ratatui's re-export:
# `crossterm::event::EventStream` (the async input source the UI loop selects
# on) lives behind the `event-stream` feature, and a feature can only be
# enabled by a crate that names the dependency. `events` is the key/resize
# types. NOT `windows`: both of these sit under
# `[target.'cfg(unix)'.dependencies]` in shep-cli, because `lookout` is
# `#[cfg(unix)]` like `commands` and `dog`, and the Windows leg of
# `main.rs::run` refuses every verb before dispatching to any of them.
crossterm = { version = "0.29", default-features = false, features = ["events", "event-stream"] }
# The MCP SDK, for `shep whistle` (spec §8, §9). Rin's ruling (2026-08-14),
# taken against a hand-rolled stdio JSON-RPC loop: MCP is an evolving
# protocol, and tracking an SDK beats owning a parser for something whose
# wire format is still moving. Deliberately the opposite of the `serve`
# ruling, where axum was overruled in favour of hand-rolling on the HTTP
# surface the metrics dog already has — a settled protocol with one
# endpoint is the case for hand-rolling, and this is not that case.
#
# MEASURED, not estimated (12a's ratatui bill came in at +48 against an
# estimate of 18-24, and that is the reason this comment carries numbers):
#   compiled: +14 crates  — rmcp, rmcp-macros, pastey, schemars,
#     schemars_derive, serde_derive_internals, dyn-clone, ref-cast,
#     ref-cast-impl, futures, futures-channel, futures-executor, futures-io,
#     futures-macro. All fourteen build on macOS and Linux; none builds C or
#     needs cmake; the highest MSRV among them is rmcp's own 1.88, which is
#     this workspace's MSRV exactly.
#   Cargo.lock: 326 -> 340, i.e. the same +14: rmcp's feature table does
#     name `reqwest?/rustls` and three siblings, but cargo only locks a
#     weakly-referenced optional dependency when the feature CONTAINING the
#     reference is enabled, and none of those four features is on here.
#     Contrast ratatui, where `ratatui-termwiz?/underline-color` sits inside
#     the `underline-color` feature this workspace DOES enable, which is why
#     `grep -c '^name = "termwiz"$' Cargo.lock` prints 1 for a backend
#     nothing builds.
#
# `schemars` is what generates each tool's input and output schema. rmcp's
# `server` feature requires it, so it costs no extra crate — but it is
# declared separately below because it is a DIRECT dependency of ours:
# `#[derive(JsonSchema)]` emits absolute `schemars::` paths, and rmcp only
# re-exports the crate (`pub use schemars;`, rmcp-3.1.2/src/lib.rs:38-39).
#
# Version 3.1.2, not "3": CI runs `-Z minimal-versions`, which resolves a
# bare "3" to 3.0.0, an API nobody here has compiled. 3.1.2 is the newest
# published version, its rust-version is 1.88 (this workspace's MSRV
# exactly), and every API this phase uses was read out of its source — see
# the plan's "Every rmcp API this plan names" table for the file:line list.
rmcp = { version = "3.1.2", default-features = false, features = ["server", "macros", "transport-io"] }
# The JSON Schema generator behind every whistle tool's declared input and
# output shape. Not a transitive we happen to get: `src/whistle/facts.rs` and
# `src/whistle/read.rs` derive `JsonSchema` on our own types, and that derive
# expands to `schemars::…` paths, so the crate has to be nameable. rmcp
# re-exports it, which is not the same thing — a re-export does not put the
# crate in our extern prelude, and routing the derive through
# `rmcp::schemars` is not an option because the derive writes the paths.
#
# Pinned exactly, same reason as rmcp: `-Z minimal-versions` would take a
# bare "1" down to 1.0.0. rmcp declares `schemars = "1.0"` with
# `features = ["chrono04"]`; 1.2.2 satisfies it and the re-resolved lockfile
# carries exactly ONE schemars package, which is the property that matters —
# two schemars majors would mean two `JsonSchema` traits and a derive
# implementing the wrong one. `chrono04` is a renamed optional dep of
# schemars (`[dependencies.chrono04] package = "chrono"`); chrono is already
# in this workspace, so it costs nothing.
#
# `derive` and `std` ARE schemars' own defaults; they are named per IR-2
# because a crate that uses a feature says so.
schemars = { version = "1.2.2", default-features = false, features = ["derive", "std"] }

# Most debuginfo in `target/` is not ours: the default `debug = true` emits
# full DWARF for every dependency and links a copy into each of the
# workspace's test binaries. Line tables carry the backtraces a panicking
# test prints; dependencies need none at all, since we do not step through
# them.
#
# Measured on a clean build of this workspace (2026-08-08, 91 crates):
# `target/debug` 899M -> 596M, a third smaller. Wall clock was 13s -> 12s,
# i.e. noise at this size — the win here is disk, not time. Expect the gap
# to widen as phases 4-6 add ratatui, sysinfo, rmcp and axum.
#
# Separately: a `target/` that has grown to tens of GB is accumulation
# across feature combos and extra target dirs (`llvm-cov-target`,
# `x86_64-pc-windows-gnu`), not one build. These settings do not shrink
# that; `cargo clean` does.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# Enabled 2026-08-09 after auditing the workspace with this lint at `warn`
# and finding zero existing violations — every
# pub `Result`-returning item already carries a `# Errors` section per
# docs/idiomatic-rust.md IR-28, this just makes CI enforce it going forward
# instead of relying on review to catch drift.
missing_errors_doc = "deny"
