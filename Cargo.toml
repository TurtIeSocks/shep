[workspace]
resolver = "3"
members = [
    "crates/shep-core",
    "crates/shep-daemon",
    "crates/shep-client",
    "crates/shep-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.88 forced by serde-saphyr (let-chains, stabilized 1.88) — a current dep,
# not a future one. Also the floor for ratatui/sysinfo/rmcp in later phases.
rust-version = "1.88"
repository = "https://github.com/TurtIeSocks/shep"
# Clean-room implementation — pm2 is feature-list inspiration only (Rin, 2026-08-07).
license = "MIT OR Apache-2.0"

[workspace.dependencies]
shep-core = { path = "crates/shep-core" }
shep-daemon = { path = "crates/shep-daemon" }
shep-client = { path = "crates/shep-client" }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
serde-saphyr = { version = "1", default-features = false, features = ["deserialize"] }
# Transitive floor pins (referenced from shep-core, which depends on serde-saphyr and
# json5) forcing -Z minimal-versions past bugs where a transitive dep under-declares its
# own true minimum:
#   - annotate-snippets 0.12.0/0.12.1/0.12.2 lack `Title::element()`, added in 0.12.3.
#   - annotate-snippets itself under-declares anstyle as "1.0.4"; it actually needs
#     `impl Display for Style`, added in anstyle 1.0.5.
#   - encoding_rs_io 0.1.0/0.1.1 lack `DecodeReaderBytesBuilder::bom_override()`, added
#     in 0.1.2. Both are pulled in by serde-saphyr's `deserialize` feature.
#   - pest 2.0.0/2.0.1 lack `error::LineColLocation` and `Error::line_col`, which
#     json5 0.4.0's error.rs uses despite json5 only declaring pest = "2.0"; present
#     from pest 2.0.2.
#   - json5's pest_derive 1.0.2 (pulled in by pest_meta as a bootstrap dependency,
#     unrelated to the pest 2.x line above) under-declares quote as "^0.3" (floor
#     0.3.0), but its generated code needs `Tokens::append(impl ToString)` and
#     `Tokens::as_ref()`, added in quote 0.3.15.
#   - tokio-util's `tracing` dependency chain pulls in tracing-attributes, which
#     under-declares syn as "1" (floor 1.0.0) but needs `LitInt::base10_parse`,
#     added in syn 1.0.1.
annotate-snippets = { version = "0.12.3", default-features = false }
anstyle = { version = "1.0.5", default-features = false }
encoding_rs_io = { version = "0.1.2", default-features = false }
pest = { version = "2.0.2", default-features = false }
quote = { version = "0.3.15", default-features = false }
syn = { version = "1.0.1", default-features = false }
json5 = { version = "0.4", default-features = false }
# regex 1.8.0's compiled-size accounting lets `selector_spec_oversized_regex_is_rejected`'s
# huge pattern slip under the 1 MiB `size_limit`; 1.9+ rejects it. Floor to 1.9 so the
# selector-bridge test holds under `-Z minimal-versions`.
regex = { version = "1.9", default-features = false, features = ["std", "unicode-perl"] }
globset = { version = "0.4", default-features = false }
# `tokio::task::JoinHandle::is_finished` (shep-daemon's fake.rs cancel-safety test uses
# it to assert a `wait()` future is genuinely still pending before dropping it) landed in
# tokio 1.19.0, but shep-daemon's tokio_runner.rs (the real `ProcessRunner`, already
# landed in Phase 2a but never rehearsed against `-Z minimal-versions` with the `process`
# feature before Task 2's bus rehearsal caught it) needs two later APIs:
# `Command::as_std_mut` (added 1.39.1 — 1.39.0 was yanked) and `Command::process_group`
# losing its `#[cfg(tokio_unstable)]` gate (1.40.0). Floor to 1.40 — the lowest we've
# empirically confirmed builds and passes the workspace under `-Z minimal-versions`.
tokio = { version = "1.40", default-features = false }
# 0.7.0 has a broken minimum floor: it needs a newer tokio (mpsc `reserve_owned`, absent
# from tokio 1.0.1) and a working log/tracing bridge (`trace!` fails to resolve under
# minimal deps). Fixed in 0.7.1, which also pulls in a tokio floor high enough to compile.
tokio-util = { version = "0.7.1", default-features = false, features = ["codec"] }
bytes = { version = "1", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Only shep-daemon: process-group signal delivery and process-related syscalls for the
# real ProcessRunner (kill ladder, SIGKILL tree); `user` adds geteuid for the same-uid
# peer-cred check and passwd/group lookups for `user`/`group` spawn.
nix = { version = "0.29", default-features = false, features = ["signal", "process", "user"] }
# Only shep-daemon: passes the shepherd-channel socketpair as fd 3 into the spawned child.
command-fds = { version = "0.3", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
# Transitive floor pin: `tracing`'s own Cargo.toml under-declares its `tracing-core`
# requirement down to versions lacking `impl Value for String`, which shep-daemon's
# supervisor.rs needs for the bare-field `tracing::debug!(id, name, value, ...)` shorthand
# (a Phase 2a call site, also caught by Task 2's minimal-versions rehearsal). Missing in
# 0.1.26/0.1.27; present from 0.1.28.
tracing-core = { version = "0.1.28", default-features = false }
# Our `insta::assert_json_snapshot!` calls in shep-core (protocol::request,
# protocol::events) snapshot newtype/tuple enum variants (the Result-shaped reply
# payload); 1.18.0 has a JSON-serialization regression with exactly that shape, fixed
# in 1.18.1.
insta = { version = "1.18.1", default-features = false, features = ["json"] }
tempfile = { version = "3", default-features = false }
# Only shep-daemon (dev): property tests on the kill ladder / supervisor state machine.
proptest = { version = "1", default-features = false, features = ["std"] }
# For the event-bus subscription stream: `broadcast::Receiver` has no poll
# API, so a hand-rolled `Stream::poll_next` over it either does not compile
# or busy-spins on `try_recv` (which registers no waker).
# `wrappers::BroadcastStream` is the upstream answer, gated behind the `sync`
# feature, which does not exist before 0.1.3 — verified against the
# crates.io index, where 0.1.0-0.1.2 declare only
# `default`/`fs`/`io-util`/`net`/`time`. `BroadcastStreamRecvError` is
# defined at tokio-stream-0.1.3/src/wrappers/broadcast.rs:22, so 0.1.3 is
# the correct floor.
tokio-stream = { version = "0.1.3", default-features = false, features = ["sync"] }
# `shep-cli`'s dev-dependencies, for Task 12's real-binary e2e tier
# (`crates/shep-cli/tests/cli_e2e.rs`). Neither crate has any call site yet —
# this phase's other tasks land the assertions that actually exercise them —
# so no feature beyond the bare crate is named; the task that writes the
# first assertion adds whatever feature it needs (`regex`, `diff`, ...) with
# its own comment. `default-features = false` already matches assert_cmd's
# real default (neither of its two features, `color`/`color-auto`, is on by
# default); for predicates it drops the upstream default set (`color`,
# `diff`, `float-cmp`, `normalize-line-endings`, `regex`) down to nothing.
assert_cmd = { version = "2", default-features = false }
predicates = { version = "3", default-features = false }
# The cron_restart dialect (spec §4). `serde` is croner's only feature and we
# do not serialize a parsed Cron — the Flockfile carries the pattern string.
croner = { version = "3.0.1", default-features = false }
# croner is generic over chrono::TimeZone; `clock` is what provides Utc::now(),
# which the daemon's cron worker reads to derive the next occurrence.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Resolves cron_timezone's IANA name to a chrono::TimeZone. croner carries this
# only as a dev-dependency, so it is ours to declare.
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
# Process-table RSS sampling for the polling memory-limit enforcer. Held at the
# 0.38 line: sysinfo 0.39.0+ declares rust-version = "1.95" and this workspace's
# MSRV is 1.88 (Cargo.toml:14, and the 1.88 leg of the CI test matrix). 0.38.4
# carries the identical API this crate uses — refresh_processes_specifics,
# ProcessRefreshKind::nothing/with_memory, Process::memory/parent, Pid::as_u32.
# Defaults bring component/disk/network/user, none of which the daemon reads;
# the `multithread` feature pulls rayon into a daemon whose idle-footprint goal
# is single-digit MB (spec §14.11) and is not enabled.
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }

# Most debuginfo in `target/` is not ours: the default `debug = true` emits
# full DWARF for every dependency and links a copy into each of the
# workspace's test binaries. Line tables carry the backtraces a panicking
# test prints; dependencies need none at all, since we do not step through
# them.
#
# Measured on a clean build of this workspace (2026-08-08, 91 crates):
# `target/debug` 899M -> 596M, a third smaller. Wall clock was 13s -> 12s,
# i.e. noise at this size — the win here is disk, not time. Expect the gap
# to widen as phases 4-6 add ratatui, sysinfo, rmcp and axum.
#
# Separately: a `target/` that has grown to tens of GB is accumulation
# across feature combos and extra target dirs (`llvm-cov-target`,
# `x86_64-pc-windows-gnu`), not one build. These settings do not shrink
# that; `cargo clean` does.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# Enabled 2026-08-09 after auditing the workspace with this lint at `warn`
# and finding zero existing violations (Phase 4 Task 7 fix round) — every
# pub `Result`-returning item already carries a `# Errors` section per
# docs/idiomatic-rust.md IR-28, this just makes CI enforce it going forward
# instead of relying on review to catch drift.
missing_errors_doc = "deny"
