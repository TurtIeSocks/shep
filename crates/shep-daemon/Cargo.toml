[package]
name = "shep-daemon"
description = "The supervision engine behind shep: process spawning, restart policy, the log plane, watch and cron restarts, and the RPC server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
documentation = "https://docs.rs/shep-daemon"
keywords = ["shep", "process-manager", "supervisor", "daemon", "restart"]
categories = ["os", "os::unix-apis", "asynchronous"]

# No `[package.metadata.docs.rs]`: `test-fakes` is this crate's only
# feature, and it is test scaffolding, not public API worth unlocking.
[features]
# Option: expose the scripted fake runner (`fake::ScriptedRunner`) to other
# crates' tests. Off by default, since it is test scaffolding, not public API.
test-fakes = []

[dependencies]
shep-core.workspace = true
# `fs` for tokio_runner.rs's log-file append, `signal` for the daemon's
# shutdown listeners in boot.rs, and `net`/`io-util` for the RPC server's
# framed connections.
tokio = { workspace = true, features = ["rt", "process", "io-util", "time", "sync", "net", "fs", "macros", "signal"] }
# The client<->daemon framing: the SAME codec shep-core exposes, so the daemon can
# never drift from the shared frame parameters.
tokio-util.workspace = true
# SinkExt/StreamExt on the framed halves of a connection.
futures-util.workspace = true
# encode_frame hands back Bytes; the per-connection write queue carries them as-is.
bytes.workspace = true
# Server-side topic filtering for Subscribe (spec §6 glob topics).
globset.workspace = true
# Atomic muster-roll writes: NamedTempFile in the same dir + persist = rename(2).
tempfile.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
# Rendering one `[dog.<name>]` table back to TOML text (dogs.rs): the reply
# a dog parses is the section as text, not a shep type. `parse` comes with
# the workspace entry because shep-core needs it to produce the table in the
# first place; this crate only writes one back out.
toml.workspace = true
# `dogs::set_dog_section`'s read-modify-write of `dogs.toml`: the file is
# hand-editable on purpose, so the daemon edits the document it read rather
# than rendering a parsed map back out, and a comment or a key order an
# operator chose survives.
toml_edit.workspace = true
# DateTime<Utc> for the Clock seam (cron.rs): cron means wall time, which is
# not the same clock as tokio::time's paused Instant.
chrono.workspace = true
# Process-table RSS sampling for the MemorySampler seam (limits/sample.rs):
# resident memory across a sheep's whole process tree.
sysinfo.workspace = true
# The OS seam for watch-restart (watch/source.rs): bridges notify's debounced
# filesystem events onto a tokio mpsc channel.
notify.workspace = true
notify-debouncer-full.workspace = true

# nix is #![cfg(unix)] internally and command-fds does unconditional
# unix-only fd plumbing. The pure tier (types/traits/fake) compiles
# everywhere; the OS tier (signal delivery, fd-passing) is unix-only. `fs`
# is for sys.rs's readiness-pipe adoption: `nix::fcntl::fcntl`/
# `FcntlArg::F_GETFD` lets `adopt_fd` refuse a closed descriptor.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }
command-fds.workspace = true

# The job object that stands in for a unix process group. Confined to
# `sys_windows.rs`, which is this crate's only unsafe surface on Windows
# exactly as `sys.rs` is on unix.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
getrandom.workspace = true

# `cfg(any())` never matches, so nothing here compiles into a real build, but
# Cargo's resolver still walks these entries under `-Z minimal-versions`.
# Forces a floor pin for tracing's under-declared tracing-core floor (see
# root Cargo.toml). Safe to drop once tracing corrects it.
[target.'cfg(any())'.dependencies]
tracing-core.workspace = true
# Same mechanism, for notify's under-declared fsevent-sys floor (see root
# Cargo.toml). macOS only in principle, but this crate has no
# `cfg(target_os = "macos")` section of its own to hold it.
fsevent-sys.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
# `tests/real_runner_windows.rs` walks the real process table to prove a
# sheep's lamb does not outlive `kill_tree`. Adds no crate: an integration
# test is its own crate and cannot reach the lib's own deps.
sysinfo.workspace = true
proptest.workspace = true
# The scoped, per-test subscriber `testing::capture_logs` installs, so a
# warn-and-continue arm's record is something a test can assert on. Dev-only:
# the daemon library installs no subscriber of its own; `shep-cli`'s
# `daemon` subcommand owns the one global install.
tracing-subscriber.workspace = true

# Only for `examples/reuse_port_sheep.rs`, the fixture behind the reload
# tests in `tests/daemon_e2e.rs`: `socket` sets `SO_REUSEPORT` before a bind,
# the one thing `std` cannot express; `net` is where nix keeps `SockaddrIn`.
# Own `cfg(unix)` table: nix does not build on Windows.
[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["socket", "net"] }

[lints]
workspace = true
