[package]
name = "shep-daemon"
description = "Supervisor engine for shep: spawn, restart, reload, watch, cron-restart, memory-limit polling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[features]
# Option: expose the scripted fake runner (`fake::ScriptedRunner`) to other
# crates' tests. Off by default — it is test scaffolding, not public API.
test-fakes = []

[dependencies]
shep-core.workspace = true
# `fs` for tokio_runner.rs's log-file append, `signal` for the daemon's
# shutdown listeners in boot.rs, and `net`/`io-util` for the RPC server's
# framed connections.
tokio = { workspace = true, features = ["rt", "process", "io-util", "time", "sync", "net", "fs", "macros", "signal"] }
# The client<->daemon framing: the SAME codec shep-core exposes, so the daemon can
# never drift from the shared frame parameters.
tokio-util.workspace = true
# SinkExt/StreamExt on the framed halves of a connection.
futures-util.workspace = true
# encode_frame hands back Bytes; the per-connection write queue carries them as-is.
bytes.workspace = true
# Server-side topic filtering for Subscribe (spec §6 glob topics).
globset.workspace = true
# Atomic muster-roll writes: NamedTempFile in the same dir + persist = rename(2).
tempfile.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
# DateTime<Utc> for the Clock seam (cron.rs): cron means wall time, which is
# not the same clock as tokio::time's paused Instant.
chrono.workspace = true
# Process-table RSS sampling for the MemorySampler seam (limits/sample.rs) —
# resident memory across a sheep's whole process tree.
sysinfo.workspace = true
# The OS seam for watch-restart (watch/source.rs): bridges notify's debounced
# filesystem events onto a tokio mpsc channel.
notify.workspace = true
notify-debouncer-full.workspace = true

# nix is #![cfg(unix)] internally and command-fds does unconditional unix-only fd
# plumbing, so both would fail to compile on a Windows CI leg. Rin's Windows ruling:
# the pure tier (this crate's types/traits/fake) compiles everywhere; the OS tier
# (signal delivery, fd-passing) is unix-only for now. tokio_runner.rs/kill.rs use
# the workspace-default nix features (signal, process, user); sys.rs's readiness-pipe
# adoption additionally needs "fs" for `nix::fcntl::fcntl`/`FcntlArg::F_GETFD`, the
# safe probe that lets `adopt_fd` refuse a closed descriptor instead of adopting it.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }
command-fds.workspace = true

# `cfg(any())` never matches any target, so nothing here is ever compiled into any real
# build — but Cargo's resolver still walks these entries when computing the dependency
# graph, including under `-Z minimal-versions`. Used to force a floor pin for a transitive
# dep whose own Cargo.toml under-declares its true minimum (see root Cargo.toml comment
# for the per-crate reasoning). Safe to drop once `tracing` corrects its own declared
# `tracing-core` floor.
[target.'cfg(any())'.dependencies]
tracing-core.workspace = true
# Same mechanism, for notify's under-declared fsevent-sys floor (root
# Cargo.toml's comment on the `fsevent-sys` entry has the exact API). macOS
# only in principle, but this crate has no `cfg(target_os = "macos")`
# dependency section of its own, so `cfg(any())` is the opt-in that puts it
# in the graph everywhere the rehearsal needs to see it.
fsevent-sys.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
proptest.workspace = true
# The scoped, per-test subscriber `testing::capture_logs` installs, so a
# warn-and-continue arm's record is something a test can assert on instead of
# something that vanishes at the macro. Dev-only: the daemon library installs
# no subscriber of its own — `shep-cli`'s `daemon` subcommand owns the one
# global install.
tracing-subscriber.workspace = true

# Only for `examples/reuse_port_sheep.rs`, the fixture server behind the reload
# measurement in `tests/daemon_e2e.rs`: `socket` is what sets `SO_REUSEPORT`
# before a bind, which is the mechanism a reload's overlap rests on and the one
# thing `std` cannot express; `net` is where nix keeps `SockaddrIn`, so a bind
# has an address to name. Dev-only, and in its own `cfg(unix)` table for the
# reason the dependency table above gives — nix does not build on Windows, and
# that leg of the matrix compiles this crate's examples too.
[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["socket", "net"] }

[lints]
workspace = true
