[package]
name = "shep-client-testing"
description = "Hand-rolled daemon fakes for testing shep-client and its consumers"
# Test scaffolding, never a published artifact: this crate exists so the fakes
# do NOT ship inside shep-client's source, and `publish = false` is what makes
# that structural rather than a matter of discipline.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
shep-client.workspace = true
shep-core.workspace = true
# `net` for the `UnixListener` every fake binds, `rt` for the background task
# each one spawns, `sync` for the script channel, `macros` for the
# `tokio::select!` in the scripted serve loop.
tokio = { workspace = true, features = ["net", "rt", "sync", "macros"] }
# The SAME codec shep-core exposes, so a fake can never drift from the shared
# frame parameters.
tokio-util.workspace = true
# SinkExt/StreamExt on the framed connection each fake serves.
futures-util.workspace = true

[lints]
workspace = true
