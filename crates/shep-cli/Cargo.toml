[package]
name = "shep"
description = "The shep binary: a process manager that keeps a flock of long-running processes alive on macOS, Linux and Windows, with logs, watch and cron restarts, and webhook alerts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["shep", "process-manager", "supervisor", "daemon", "cli"]
categories = ["command-line-utilities", "os", "development-tools"]
# The docs site, not docs.rs: this crate ships a CLI, and docs.rs would
# render the thin library underneath its three [[bin]] targets instead.
documentation = "https://shep-pm.com"

[lib]
name = "shep"
path = "src/lib.rs"

[[bin]]
name = "shep"
path = "src/bin/shep.rs"

# Container entrypoint aliases (spec §3). Each is three lines over the library
# above; the verb is supplied by the entry point it calls, so nothing here
# reads argv[0].
[[bin]]
name = "shep-runtime"
path = "src/bin/shep-runtime.rs"

[[bin]]
name = "shep-dev"
path = "src/bin/shep-dev.rs"

# The .deb built by `.github/workflows/release-artifacts.yml`, for the
# download-and-`dpkg -i` path in docs/distribution.md, not `apt install`,
# which needs a signed repository nobody hosts yet.
#
# Built against musl, never glibc: `depends = "$auto"` writes whatever glibc
# the builder linked against, and ubuntu-latest's 2.39 would refuse to
# install on Debian 12 or Ubuntu 22.04. A static musl binary avoids that.
#
# No systemd unit and no maintainer scripts: `shep startup` renders and
# installs the unit when an operator asks, so a `postinst` doing it instead
# would write to a user's systemd state before they have written a Flockfile.
[package.metadata.deb]
maintainer = "TurtIeSocks <TurtIeSocks@users.noreply.github.com>"
copyright = "Copyright (c) TurtIeSocks"
# cargo-deb takes one license file. Both ship as assets below, since the
# license is "MIT OR Apache-2.0" and a reader needs to see both to choose.
license-file = ["LICENSE-APACHE", "0"]
section = "admin"
priority = "optional"
depends = "$auto"
extended-description = """shep keeps a flock of long-running processes alive: it restarts them when they die, captures what they print, and says plainly when something is wrong. It also restarts on file changes, on a cron schedule, or over a memory limit, and can alert a webhook when a process misbehaves.

This package installs the binaries only. Run `shep startup` to have systemd supervise the flock from boot; nothing here writes to systemd on your behalf."""
assets = [
    # `target/release/` is cargo-deb's own prefix for a built binary. It
    # rewrites it to the real target directory, so this is correct under
    # `--target=x86_64-unknown-linux-musl` as well.
    ["target/release/shep", "usr/bin/", "755"],
    ["target/release/shep-runtime", "usr/bin/", "755"],
    ["target/release/shep-dev", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/shep/README.md", "644"],
    ["LICENSE-MIT", "usr/share/doc/shep/LICENSE-MIT", "644"],
    ["LICENSE-APACHE", "usr/share/doc/shep/LICENSE-APACHE", "644"],
    # Written by the release workflow before it calls cargo deb, by running
    # the binary it just built. Paths are relative to this manifest, which is
    # why they land in the crate directory rather than under `target/`.
    ["completions/shep.bash", "usr/share/bash-completion/completions/shep", "644"],
    ["completions/_shep", "usr/share/zsh/vendor-completions/_shep", "644"],
    ["completions/shep.fish", "usr/share/fish/vendor_completions.d/shep.fish", "644"],
]

[dependencies]
# `features = ["schema"]`: `shep schema` prints `shep_core::config::
# flockfile_schema_json()`, which only exists behind that feature. This
# crate names no `schemars` type of its own; it calls a shep-core function
# that returns a `String`.
shep-core = { workspace = true, features = ["schema"] }
# Unconditional even though only its `#[cfg(unix)]` modules (`boot`, `sys`,
# `tokio_runner`, `server`) are reachable here: the pure tier compiles on
# every target, so the platform gate belongs on our `use` sites, not on this
# dependency edge.
shep-daemon.workspace = true
shep-client.workspace = true
# `dog::metrics`'s host reading (`shep_host_*`). Adds zero crates: the same
# workspace-pinned version shep-daemon already carries for its tree sampler
# (`limits/sample.rs`).
sysinfo.workspace = true
# `serve`'s basic-auth comparison, through `hmac::sign`/`hmac::verify`, not
# `ring::constant_time`: that module is `deprecated_constant_time` under an
# alias in 0.17.14, and its own doc disclaims side-channel guarantees for
# external callers. Adds zero crates: `tokio-rustls` above already pulls
# this exact version in for the bark dog's TLS. Named directly since rustls
# does not re-export ring's hmac.
ring = { version = "0.17", default-features = false }
# How many terminal columns a `char` occupies, for `output::width` (every
# table cell's padding) and `lookout`'s own `fit`: measuring by char count
# alone lets a CJK name or double-width log line overrun its column and
# push every border after it. Adds zero crates: `ratatui-core` and
# `shep-core` (through `annotate-snippets`) already resolve this version.
#
# `default-features = false` drops `cjk`, which provides `width_cjk`, the
# East-Asian Ambiguous reading where `▸` and friends measure two columns.
# Plain `width` is right for a terminal nobody has told us is CJK-legacy.
unicode-width = { version = "0.2", default-features = false }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "env", "wrap_help"] }
# `default-features = false` is a no-op: clap_complete's default feature set
# is empty, kept for consistency. `unstable-dynamic` not enabled: dynamic
# completion is out of scope.
#
# Floor 4.6.0: `CompletionArgs::shell` names `clap_complete::aot::Shell`, and
# the `aot` module does not exist before 4.6.0.
clap_complete = { version = "4.6.0", default-features = false }
# `io-util` is `crate::http`'s: `BufReader`, `AsyncBufReadExt`/
# `AsyncReadExt`/`AsyncWriteExt`, and `tokio::io::duplex` for its tests.
# `fs` is `serve::worker`'s: `tokio::fs::File` and `tokio::io::copy` for
# streaming a served file off disk. Adds zero crates: tokio's `fs` feature
# is `spawn_blocking` over `std::fs`.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "io-util", "fs"] }
# `dog::bark::sinks`'s TLS transport for Discord/Slack webhooks, a
# hand-rolled HTTP/1.1 client over `tokio-rustls` (see the root Cargo.toml
# entry). `ring`/`tls12` name the crypto provider directly so tokio-rustls's
# own default features, which pull in `aws_lc_rs` and need cmake, never apply.
tokio-rustls.workspace = true
# Mozilla's compiled-in TLS root store, for the same TLS connector.
webpki-roots.workspace = true
# The one global subscriber install in the workspace, in `commands::daemon`.
# Every feature the workspace entry names is live there: `fmt` renders,
# `env-filter` turns `[daemon] log_level` into a filter, `json` is the
# `log_json` branch, `ansi` is colour when stderr is a terminal and
# `NO_COLOR` says nothing to the contrary.
tracing-subscriber.workspace = true
# `output::table::local_timestamp`'s rendering of `shep barks`' `WHEN`
# column: `Bark::at_ms` (unix millis, UTC by construction) into the
# operator's own local zone. Adds zero crates: shep-core and shep-daemon
# already carry it; `clock` is what makes `Local` exist to convert into.
chrono.workspace = true
# `bleats.rs`'s `stream.next()` comes from `EventStream::next`, an inherent
# method shep-client provides; no `StreamExt` import needed. This stays for
# `FutureExt`: the Ctrl-C wiring (`tokio::signal::ctrl_c().map(|_| ())`)
# needs it.
futures-util.workspace = true
# `Render: Serialize` needs the trait and its derive, not just the
# serializer: `serde_json` alone does not bring either.
serde.workspace = true
serde_json.workspace = true
# Rendering the Flockfile `shep import` writes. `parse` is unused here (the
# CLI reads Flockfiles through shep-core), but the workspace entry names
# both and a per-crate feature narrowing would be the only difference.
toml.workspace = true
# `commands::shep_toml`'s `ShepToml`: the one writer of `$SHEP_HOME/shep.toml`,
# edited through `toml_edit::DocumentMut` rather than a plain `toml::Table`
# so an operator's comments, key order and formatting survive a
# `shep enable`/`shep disable`.
toml_edit.workspace = true
# `commands::shep_toml`'s write path: `shep.toml` is staged in a sibling temp
# file at `0600` (via `Builder::permissions`), `fsync`ed and `rename`d over
# the original, the same shape shep-core's `barks::write_ring` uses. Adds
# zero crates: shep-core and shep-daemon already carry this version.
tempfile.workspace = true
# `style::StyleLevel::colour()`'s consumer: the boxed renderer picks its ANSI
# escapes through `anstyle::Style`/`Color` rather than hand-rolled escape
# sequences. Adds zero crates: shep-core already resolves `anstyle` through
# its own `cfg(any())` floor-forcing block.
anstyle.workspace = true

# The lookout TUI, the MCP server behind `shep whistle`, and the schema
# generator beside it: unconditional, since `src/lookout/` and `src/whistle/`
# both compile and run on Windows too.
ratatui.workspace = true
crossterm.workspace = true
# The MCP server behind `shep whistle`.
rmcp.workspace = true
# The schema generator, beside it. Declared rather than reached through
# `rmcp::schemars`, because `#[derive(JsonSchema)]` in `src/whistle/` expands
# to absolute `schemars::` paths.
schemars.workspace = true
# Two `ratatui` transitive floors, only ever read by `-Z minimal-versions`;
# see the workspace `Cargo.toml`'s comments on each.
time.workspace = true
instability.workspace = true

[dev-dependencies]
# `test-util` for `#[tokio::test(start_paused = true)]`, `crate::http`'s "a
# peer that says nothing is dropped at the timeout" test.
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
# The same shep-client the `[dependencies]` entry above pulls in, asking for
# the hand-rolled daemon fakes this crate's command tests drive. A
# dev-dependency, so the feature is on for the test targets and off for the
# shipped binary.
# Path-only, with no `version`, for the reason `crates/shep-macros/Cargo.toml`
# spells out: `cargo publish` keeps a dev-dependency that carries a version and
# drops one that does not, so a version here would make packaging this crate
# require a shep-client release that may not exist yet. That is not a deadlock
# from this side, since shep publishes last, but it is the same publish-order
# constraint and it buys nothing. `scripts/check-dev-deps.py` enforces the rule.
shep-client = { path = "../shep-client", features = ["test-support"] }
# Snapshot coverage for `--format json` payloads.
insta.workspace = true
# The real-binary e2e tier (`tests/cli_e2e.rs`).
assert_cmd.workspace = true
predicates.workspace = true
# Property test for `output::table`: any cell's rendered width matches its
# declared column width regardless of ANSI styling.
proptest.workspace = true

# `geteuid` (the privilege gate `shep startup` refuses on) and
# `User::from_name`/`User::from_uid` (the target user's own passwd home, not
# `$HOME` under sudo) use nix's `user` feature, already on by workspace
# default. `fs` adds `nix::fcntl::fcntl`/`FcntlArg::F_SETFD`/`FdFlag`, the
# inherited-fd sweep in `launch.rs`. `cfg(unix)`: nix does not build on
# Windows, and this crate's Windows leg compiles everything outside
# `commands/`.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }
# A process-group assertion and a teardown Drop guard both need to signal a
# real pid; same cfg(unix) dev-only shape shep-daemon uses. The workspace
# default nix features (signal, process, user) already cover `getpgid` and
# `kill`.
[target.'cfg(unix)'.dev-dependencies]
nix.workspace = true

[lints]
workspace = true

# `cfg(any())` never matches, so nothing here compiles into a real build, but
# Cargo's resolver still walks these entries under `-Z minimal-versions`.
# Forces `lazy_static` past the floor `sharded-slab`'s path import needs (see
# root Cargo.toml). Safe to drop once sharded-slab corrects its own floor.
[target.'cfg(any())'.dependencies]
lazy_static.workspace = true
