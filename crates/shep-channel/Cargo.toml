[package]
name = "shep-channel"
description = "Client for the shep shepherd channel: readiness, metrics and custom actions over the descriptor shep hands a supervised process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
documentation = "https://docs.rs/shep-channel"
keywords = ["shep", "process-manager", "ipc", "readiness", "metrics"]
categories = ["api-bindings", "os"]

[package.metadata.docs.rs]
all-features = true

[features]
# On by default. The client: descriptor discovery, the reader and writer
# threads, and the handler layer. `shep-core` takes this crate with
# `default-features = false` because it wants the wire types and nothing
# else; an app wants the whole thing and says nothing.
default = ["client"]
client = ["dep:serde_json", "dep:windows-sys"]

[dependencies]
# `features = ["std"]` is load-bearing, not tidiness. The workspace pins serde
# with `default-features = false`, and both enums here are internally tagged
# (`#[serde(tag = "kind")]`), whose derive expands to serde's Content
# machinery -- `TaggedContentVisitor` and friends -- which lives behind
# serde/std. Without this the crate compiles only when something else in the
# graph happens to enable serde/std, which `--no-default-features` is exactly
# the check for. A member may raise a workspace dependency's features; it may
# not lower them.
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, optional = true }

# `PeekNamedPipe`, and the two error codes that mean the shepherd has gone.
# Windows only, and only with the client: `endpoint::PipeReader` explains why
# the reader there cannot simply park in a `ReadFile` the way the unix one
# does, and this is the one call it needs to avoid that.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
], optional = true }

[dev-dependencies]
serde_json.workspace = true

# Maps a socketpair onto fd 3 in `tests/real_child.rs`, the same crate
# `tokio_runner.rs` uses for the real thing. Unix-only: that mapping is the
# unix half of the contract, and `command-fds` does unconditional unix fd
# work.
[target.'cfg(unix)'.dev-dependencies]
command-fds.workspace = true

# Stands up a real named pipe server for `tests/real_child.rs`. The same
# `ServerOptions` call the daemon's own `shep_core::transport::Listener`
# makes, so that test's shepherd end is the production one rather than a
# lookalike that could agree with a bug.
[target.'cfg(windows)'.dev-dependencies]
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"] }

[lints]
workspace = true
