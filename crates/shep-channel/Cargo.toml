[package]
name = "shep-channel"
description = "Client for the shep shepherd channel: readiness, metrics and custom actions over the descriptor shep hands a supervised process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
documentation = "https://docs.rs/shep-channel"
keywords = ["shep", "process-manager", "ipc", "readiness", "metrics"]
categories = ["api-bindings", "os"]

[package.metadata.docs.rs]
all-features = true

[features]
# On by default. The client: descriptor discovery, the reader and writer
# threads, and the handler layer. `shep-core` takes this crate with
# `default-features = false` because it wants the wire types and nothing
# else; an app wants the whole thing and says nothing.
default = ["client"]
client = ["dep:serde_json"]

[dependencies]
# `features = ["std"]` is load-bearing, not tidiness. The workspace pins serde
# with `default-features = false`, and both enums here are internally tagged
# (`#[serde(tag = "kind")]`), whose derive expands to serde's Content
# machinery -- `TaggedContentVisitor` and friends -- which lives behind
# serde/std. Without this the crate compiles only when something else in the
# graph happens to enable serde/std, which `--no-default-features` is exactly
# the check for. A member may raise a workspace dependency's features; it may
# not lower them.
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
