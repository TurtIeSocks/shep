[package]
name = "shep-core"
description = "Types, Flockfile parsing, and the wire protocol shared by the shep process manager's daemon, client, and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
documentation = "https://docs.rs/shep-core"
keywords = ["shep", "process-manager", "supervisor", "flockfile", "protocol"]
categories = ["config", "parsing", "data-structures"]

# No `default` feature exists, so docs.rs's default build would compile this
# crate without `schema`, hiding `flockfile_schema_json` and every
# `JsonSchema` impl. `all-features` is baked into the docs.rs build per
# published version and cannot change after the fact.
[package.metadata.docs.rs]
all-features = true

[features]
# Off by default. `JsonSchema` derives for the Flockfile document schema
# (`assets/flockfile.schema.json`), which `shep schema` prints.
#
# Inert inside this workspace: cargo unifies features, so every
# `--all-features` command and the shipped `shep` binary compile this crate
# with schemars regardless. It matters only for a consumer of the published
# crate, or a standalone `cargo build -p shep-daemon`.
schema = ["dep:schemars"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
serde-saphyr.workspace = true
json5.workspace = true
regex.workspace = true
tokio-util.workspace = true
# `transport`: the control plane's carrier (unix socket / Windows named
# pipe). Owned here, not above, to keep `cfg(unix)` out of every layer above.
# Adds no crate: shep-daemon, shep-client and shep-cli already depend on
# tokio, and `net`/`time` are features two of them already enable.
tokio = { workspace = true, features = ["net", "time", "io-util", "macros"] }
bytes.workspace = true
croner.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
# Adds no package to the tree: rmcp's server feature already resolves
# schemars 1.2.2 for whistle, workspace-pinned exactly. Adds one edge only.
schemars = { workspace = true, optional = true }
# Compiles `watch_options`/`ignore_watch` globs at config time, the same
# engine spec §4 names for the daemon's own watch filter: a pattern
# `normalize` accepts is one the filter can build.
globset.workspace = true
# `barks::append` stages the rewritten ring through a uniquely-named sibling
# temp file and `persist`es it over the ledger via rename(2). The uniqueness
# matters: a single deterministic `<path>.tmp` lets one writer's rename
# consume another's staging file. Adds no crate: shep-daemon already depends
# on it.
tempfile.workspace = true

# `barks::append` holds an advisory `flock` across its whole read-modify-rename
# so two writer processes serialise instead of clobbering. Adds no crate:
# nix already carries the `fs` feature in shep-daemon. `cfg(unix)`: nix does
# not build on Windows; `barks.rs` carries the Windows story in code.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
insta.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }
futures-util.workspace = true

# `cfg(any())` never matches, so nothing here compiles into a real build, but
# Cargo's resolver still walks these entries under `-Z minimal-versions`.
# Forces floor pins for transitive deps that under-declare their true
# minimum (see root Cargo.toml). Safe to drop a line once upstream corrects
# its own floor.
[target.'cfg(any())'.dependencies]
annotate-snippets.workspace = true
anstyle.workspace = true
encoding_rs_io.workspace = true
pest.workspace = true
quote-floor.workspace = true
syn-floor.workspace = true

[lints]
workspace = true
