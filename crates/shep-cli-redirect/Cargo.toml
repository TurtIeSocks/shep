[package]
name = "shep-cli"
description = "Renamed to shep. This crate is an empty placeholder published only to keep the shep-cli name from being squatted; install shep instead."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["shep", "renamed", "redirect"]
categories = ["command-line-utilities"]
# Points at the crate that replaced this one, since that is the only thing a
# reader who lands here needs.
documentation = "https://docs.rs/shep"
# No [lib] or [[bin]] table: Cargo requires at least one target to exist,
# so `src/lib.rs` is present and autodiscovered but declares nothing. No
# [[bin]] means `cargo install shep-cli` fails outright, which is the point.
# See README.md for why this crate is published at all.

[lints]
workspace = true
