[package]
name = "shep-client"
description = "Async RPC client and programmatic API for the shep daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
shep-core.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time", "sync", "macros"] }
tokio-util.workspace = true
tokio-stream.workspace = true   # wrappers::BroadcastStream, for the event-bus subscription stream
futures-util.workspace = true

[dev-dependencies]
# The hand-rolled daemon fakes, in their own crate so they never ship inside
# this one. shep-client-testing depends on shep-client, so this edge closes a
# cycle — legal, and only legal, because it is a dev-dependency: Cargo builds
# the lib first, then the test targets against it.
shep-client-testing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tempfile.workspace = true

# The zombie reaper needs `waitpid`; dev-only and unix-only, same shape
# shep-daemon uses. The workspace default features already cover it.
[target.'cfg(unix)'.dev-dependencies]
nix.workspace = true

[lints]
workspace = true
