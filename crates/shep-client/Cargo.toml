[package]
name = "shep-client"
description = "Async client for the shep daemon: typed requests, event subscriptions, and starting a shepherd that is not running yet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
documentation = "https://docs.rs/shep-client"
keywords = ["shep", "process-manager", "client", "ipc", "async"]
categories = ["asynchronous", "network-programming", "api-bindings"]

# No `[package.metadata.docs.rs]`: `schema` is on by default, so the
# default build already documents `dogs::config_schema`; `test-support` is
# test scaffolding, not public API worth unlocking.
[features]
default = ["schema"]

# Option: `dogs::config_schema` and the `dogs::probe` arm that prints it. On
# by default, so following the dog docs works with no feature line. Off is
# additive, not broken: `probe` still answers the version flag and exits
# silently on the schema flag.
schema = ["dep:schemars", "dep:serde_json"]

# Option: expose `testing` (the hand-rolled daemon fakes) to other crates'
# tests. Off by default, since it is test scaffolding, not public API.
test-support = []

# These integration tests link the ordinary library, so `cfg(test)` alone
# does not reach them: declared per target so a bare
# `cargo test -p shep-client` skips them instead of failing to compile.
# `cargo test --workspace` runs them, since shep-cli's dev-dependency turns
# the feature on for the whole build.
#
# Cargo skips a target with an off required feature in silence, so `lib.rs`'s
# `heads_up_four_integration_binaries_need_test_support_and_are_not_running`
# compiles only when the feature is off, and names the gap in its own output.
[[test]]
name = "request_reply"
required-features = ["test-support"]

[[test]]
name = "event_stream"
required-features = ["test-support"]

[[test]]
name = "event_stream_next_without_futures_util"
required-features = ["test-support"]

[[test]]
name = "spawn"
required-features = ["test-support"]

[dependencies]
shep-core.workspace = true
# The `DogConfig` derive, re-exported from `dogs` next to the trait it
# implements so a dog author takes one dependency and never names this crate.
# Not optional: the derive is what stops `x-shep-secret` being a string a dog
# author hand-types, and it needs no schemars of its own to emit a name list.
shep-macros.workspace = true
# Both behind `schema`. `dogs::config_schema` generates a dog's schema and
# walks it as a `serde_json::Value` to mark the credential fields; `probe`
# prints the result. schemars is workspace-pinned and already in the tree
# through shep-core and whistle, so this adds an edge rather than a crate.
schemars = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["net", "rt", "time", "sync", "macros"] }
tokio-util.workspace = true
tokio-stream.workspace = true   # wrappers::BroadcastStream, for the event-bus subscription stream
futures-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tempfile.workspace = true

# The zombie reaper needs `waitpid`; dev-only and unix-only, same shape
# shep-daemon uses. The workspace default features already cover it.
[target.'cfg(unix)'.dev-dependencies]
nix.workspace = true

[lints]
workspace = true
