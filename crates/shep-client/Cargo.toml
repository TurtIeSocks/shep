[package]
name = "shep-client"
description = "Async RPC client and programmatic API for the shep daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[features]
# Exposes `testing` (the hand-rolled fakes) to shep-cli's tests. Mirrors
# shep-daemon's `test-fakes` (`crates/shep-daemon/Cargo.toml:12`), which does
# the same job for the scripted runner.
test-support = []

[dependencies]
shep-core.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time", "sync", "macros"] }
tokio-util.workspace = true
tokio-stream.workspace = true   # wrappers::BroadcastStream, for the event-bus subscription stream
futures-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tempfile.workspace = true

# The zombie reaper needs `waitpid`; dev-only and unix-only, same shape
# shep-daemon uses. The workspace default features already cover it.
[target.'cfg(unix)'.dev-dependencies]
nix.workspace = true

[lints]
workspace = true
