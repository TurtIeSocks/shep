# release-plz changelog template, extending git-cliff's config.
# Docs: https://git-cliff.org/docs/configuration
#
# `filter_unconventional` plus `filter_commits` and the skips below keep a
# generated section from restating every docs and chore commit alongside the
# hand-written entry that already covers the same work.

[changelog]
header = """
# Changelog

All notable changes to this crate are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first | trim }}\
            {% if commit.breaking %} **(BREAKING)**{% endif %}\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    # Must precede the generic ^chore skip (first-match-wins), or a lockstep
    # version bump leaves a silent, contentless version header.
    { message = '^chore: update Cargo\.(toml|lock) dependencies$', group = "Internal" },
    { message = "^docs", skip = true },
    { message = "^test", skip = true },
    { message = "^ci", skip = true },
    { message = "^chore", skip = true },
    { message = "^style", skip = true },
]
filter_commits = true
# Keeps any commit marked breaking regardless of which parser matched it, so
# the `^chore` skip above never drops a breaking `chore!:` commit.
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
