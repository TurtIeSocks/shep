# release-plz changelog template, extending git-cliff's config.
# Docs: https://git-cliff.org/docs/configuration
#
# Copied from zendriver-rs on 2026-08-27, with the header reworded to match
# what these four changelogs already say. Only the header differs.
#
# `filter_unconventional` plus `filter_commits` and the skips below are what
# make generation safe to turn on here. Without them a generated section
# restates every docs and chore commit alongside the hand-written entry that
# already covers the work, which is what 576 lines of duplication looked like
# the first time release-plz ran on this repository.

[changelog]
header = """
# Changelog

All notable changes to this crate are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first | trim }}\
            {% if commit.breaking %} **(BREAKING)**{% endif %}\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    # Label release-plz's synthetic dependency-only-bump commit (first-match-wins,
    # so it must precede the generic ^chore skip) instead of leaving a pure
    # lockstep version bump as a silent, contentless version header.
    { message = '^chore: update Cargo\.(toml|lock) dependencies$', group = "Internal" },
    { message = "^docs", skip = true },
    { message = "^test", skip = true },
    { message = "^ci", skip = true },
    { message = "^chore", skip = true },
    { message = "^style", skip = true },
]
filter_commits = true
# The skips above drop `^chore`, which would also drop a breaking `chore!:`
# commit: exactly the one that must never go missing from a changelog. This
# keeps any commit marked breaking regardless of which parser matched it.
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
